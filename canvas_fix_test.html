<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Fix Test</title>
    <link rel="stylesheet" href="/src/style.css">
    <style>
        #debug-info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            z-index: 1000;
            font-family: monospace;
            max-width: 300px;
        }
        .success { color: #4CAF50; }
        .error { color: #f44336; }
        .warning { color: #ff9800; }
    </style>
</head>
<body>
    <div id="app">
        <canvas id="game-canvas"></canvas>
    </div>
    
    <div id="debug-info">
        <div>Canvas Fix Test</div>
        <div id="canvas-status">Checking...</div>
        <div id="game-status">Waiting...</div>
        <div id="ui-status">Waiting...</div>
        <div id="production-status">Waiting...</div>
    </div>
    
    <script type="module">
        const canvasStatus = document.getElementById('canvas-status');
        const gameStatus = document.getElementById('game-status');
        const uiStatus = document.getElementById('ui-status');
        const productionStatus = document.getElementById('production-status');
        
        function updateStatus(element, message, type = 'info') {
            element.innerHTML = `<span class="${type}">${message}</span>`;
        }
        
        // Check canvas
        const canvas = document.getElementById('game-canvas');
        if (canvas) {
            updateStatus(canvasStatus, '✅ Canvas found in DOM', 'success');
        } else {
            updateStatus(canvasStatus, '❌ Canvas not found', 'error');
        }
        
        try {
            updateStatus(gameStatus, 'Loading Game...', 'warning');
            const { default: Game } = await import('/src/core/Game.js');
            updateStatus(gameStatus, '✅ Game imported', 'success');
            
            const game = new Game();
            updateStatus(gameStatus, '✅ Game instance created', 'success');
            
            game.init();
            updateStatus(gameStatus, '✅ Game initialized', 'success');
            updateStatus(uiStatus, '✅ UI should be visible', 'success');
            
            // Check ProductionChainUI
            if (game.uiManager && game.uiManager.productionChainUI) {
                updateStatus(productionStatus, '✅ ProductionChainUI initialized', 'success');
            } else {
                updateStatus(productionStatus, '❌ ProductionChainUI missing', 'error');
            }
            
            game.start();
            updateStatus(gameStatus, '✅ Game started successfully', 'success');
            
            window.game = game;
            
        } catch (error) {
            updateStatus(gameStatus, `❌ Error: ${error.message}`, 'error');
            console.error('Game loading error:', error);
        }
    </script>
</body>
</html>
