<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Auto Test</title>
</head>
<body>
    <h1>Automated Game Test</h1>
    <div id="log"></div>
    <canvas id="game-canvas" style="display: none;"></canvas>

    <script type="module">
        const logDiv = document.getElementById('log');
        function log(message, type = 'info') {
            console.log(message);
            const p = document.createElement('p');
            p.textContent = message;
            p.style.color = type === 'error' ? 'red' : type === 'success' ? 'green' : 'black';
            logDiv.appendChild(p);
        }

        async function runTest() {
            try {
                log('🚀 Starting automated game test...');
                
                // Step 1: Import Game
                log('📦 Importing Game class...');
                const { default: Game } = await import('./src/core/Game.js');
                log('✅ Game class imported successfully');
                
                // Step 2: Create instance
                log('🏗️ Creating Game instance...');
                const game = new Game();
                log('✅ Game instance created');
                
                // Step 3: Initialize
                log('🎮 Initializing game...');
                await game.init();
                log('✅ Game initialized successfully');
                
                // Step 4: Check components
                log('🔍 Checking game components...');
                const components = {
                    constructionManager: !!game.constructionManager,
                    serfManager: !!game.serfManager,
                    gameMap: !!game.gameMap,
                    renderer: !!game.renderer,
                    resourceManager: !!game.resourceManager
                };
                
                log('Component status:');
                Object.entries(components).forEach(([name, status]) => {
                    log(`  - ${name}: ${status ? '✅' : '❌'}`, status ? 'success' : 'error');
                });
                
                if (Object.values(components).every(Boolean)) {
                    log('🎉 All tests passed! Game is ready for construction testing.', 'success');
                    
                    // Test construction manager
                    if (game.constructionManager && game.constructionManager.isBuildable) {
                        log('🏠 Testing construction manager...');
                        const canBuild = game.constructionManager.isBuildable(5, 5);
                        log(`Can build at (5,5): ${canBuild}`, 'success');
                    }
                } else {
                    log('❌ Some components failed to initialize', 'error');
                }
                
            } catch (error) {
                log(`❌ Test failed: ${error.message}`, 'error');
                console.error('Full error:', error);
            }
        }

        // Run the test
        runTest();
    </script>
</body>
</html>
