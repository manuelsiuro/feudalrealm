<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Debug</title>
    <style>
        body { margin: 0; background: #222; }
        canvas { display: block; border: 2px solid red; }
    </style>
</head>
<body>
    <canvas id="debug-canvas" width="800" height="600"></canvas>
    <script type="module">
        import * as THREE from 'three';
        
        console.log('Debug: Starting canvas test');
        
        const canvas = document.getElementById('debug-canvas');
        console.log('Debug: Canvas element:', canvas);
        
        // Test basic canvas functionality
        const ctx = canvas.getContext('2d');
        if (ctx) {
            ctx.fillStyle = 'blue';
            ctx.fillRect(0, 0, 100, 100);
            console.log('Debug: 2D canvas works');
        }
        
        // Test Three.js
        try {
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, 800/600, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ canvas: canvas });
            
            renderer.setSize(800, 600);
            
            const geometry = new THREE.BoxGeometry();
            const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            const cube = new THREE.Mesh(geometry, material);
            scene.add(cube);
            
            camera.position.z = 5;
            
            function animate() {
                requestAnimationFrame(animate);
                cube.rotation.x += 0.01;
                cube.rotation.y += 0.01;
                renderer.render(scene, camera);
            }
            
            animate();
            console.log('Debug: Three.js works');
        } catch (error) {
            console.error('Debug: Three.js error:', error);
        }
    </script>
</body>
</html>
