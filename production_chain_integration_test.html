<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProductionChainManager Integration Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f0f0f0; }
        .test-container { background: white; padding: 20px; border-radius: 8px; margin: 10px 0; }
        .success { color: #4CAF50; }
        .error { color: #f44336; }
        .info { color: #2196F3; }
        #log { background: #f9f9f9; padding: 10px; border-radius: 4px; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>ProductionChainManager Integration Test</h1>
    
    <div class="test-container">
        <h2>Integration Status</h2>
        <div id="log">Starting integration test...\n</div>
    </div>

    <script type="module">
        const log = document.getElementById('log');
        
        function logMessage(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            log.textContent += `[${timestamp}] ${message}\n`;
            log.scrollTop = log.scrollHeight;
        }

        async function testIntegration() {
            try {
                logMessage('🧪 Testing ProductionChainManager Integration...', 'info');
                
                // Import and initialize game
                const { default: Game } = await import('./src/core/Game.js');
                logMessage('✅ Game module imported successfully');
                
                const game = new Game();
                logMessage('✅ Game instance created');
                
                await game.init();
                logMessage('✅ Game initialized');
                
                // Test 1: Check if ConstructionManager has access to game
                const hasGameRef = !!game.constructionManager.game;
                logMessage(`✅ ConstructionManager.game exists: ${hasGameRef}`, hasGameRef ? 'success' : 'error');
                
                if (hasGameRef) {
                    // Test 2: Check if ConstructionManager can access ProductionChainManager
                    const hasPCM = !!(game.constructionManager.game && game.constructionManager.game.productionChainManager);
                    logMessage(`✅ ConstructionManager can access ProductionChainManager: ${hasPCM}`, hasPCM ? 'success' : 'error');
                    
                    if (hasPCM) {
                        const registerMethod = typeof game.constructionManager.game.productionChainManager.registerBuilding;
                        logMessage(`✅ ProductionChainManager.registerBuilding method type: ${registerMethod}`, registerMethod === 'function' ? 'success' : 'error');
                    }
                }
                
                // Test 3: Check if ProductionChainManager is properly initialized
                const pcmExists = !!game.productionChainManager;
                logMessage(`✅ ProductionChainManager exists: ${pcmExists}`, pcmExists ? 'success' : 'error');
                
                // Test 4: Check if Game.animate() includes ProductionChainManager updates
                const animateCode = game.animate.toString();
                const hasProductionChainUpdate = animateCode.includes('productionChainManager.update');
                const hasProductionChainUIUpdate = animateCode.includes('productionChainUI.update');
                logMessage(`✅ Game.animate() includes ProductionChainManager.update: ${hasProductionChainUpdate}`, hasProductionChainUpdate ? 'success' : 'error');
                logMessage(`✅ Game.animate() includes ProductionChainUI.update: ${hasProductionChainUIUpdate}`, hasProductionChainUIUpdate ? 'success' : 'error');
                
                // Test 5: Check if initial buildings are registered
                const registeredBuildings = game.productionChainManager.buildings.size;
                logMessage(`📊 Initial registered buildings count: ${registeredBuildings}`);
                
                // Test 6: List registered buildings if any
                if (registeredBuildings > 0) {
                    logMessage('📋 Registered buildings:');
                    for (const [id, building] of game.productionChainManager.buildings) {
                        logMessage(`  - ${building.name} (ID: ${id})`);
                    }
                } else {
                    logMessage('ℹ️ No buildings registered yet (this is normal if no initial buildings are set up)');
                }
                
                // Test 7: Test building registration manually
                logMessage('🔧 Testing manual building registration...');
                
                // Check if there are placed buildings we can manually register
                const placedBuildings = game.constructionManager.getPlacedBuildings();
                logMessage(`📊 Placed buildings count: ${placedBuildings.length}`);
                
                if (placedBuildings.length > 0) {
                    const firstBuilding = placedBuildings[0];
                    const initialCount = game.productionChainManager.buildings.size;
                    
                    // Try to register a building manually
                    game.productionChainManager.registerBuilding(firstBuilding);
                    const newCount = game.productionChainManager.buildings.size;
                    
                    const wasRegistered = newCount > initialCount;
                    logMessage(`✅ Manual building registration test: ${wasRegistered ? 'SUCCESS' : 'ALREADY REGISTERED'}`, 'success');
                    
                    if (wasRegistered) {
                        logMessage(`  - Registered: ${firstBuilding.name} (ID: ${firstBuilding.id})`);
                    }
                }
                
                logMessage('🎉 Integration test completed successfully!', 'success');
                
            } catch (error) {
                logMessage(`❌ Test failed: ${error.message}`, 'error');
                logMessage(`Stack trace: ${error.stack}`, 'error');
            }
        }

        // Start the test
        testIntegration();
    </script>
    
    <!-- Load the validation script for browser console use -->
    <script src="validate_integration.js"></script>
</body>
</html>
