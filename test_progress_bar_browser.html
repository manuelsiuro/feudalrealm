<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Bar Test</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
        }
        #debug-output {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 5px;
            max-width: 400px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            font-size: 12px;
            line-height: 1.4;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
        }
        .test-button {
            margin: 5px;
            padding: 8px 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .test-button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div id="debug-output">
        <h3>🐛 Progress Bar Debug Console</h3>
        <button class="test-button" onclick="testProgressBars()">Test Progress Bars</button>
        <button class="test-button" onclick="startConstruction()">Start Construction</button>
        <button class="test-button" onclick="checkActiveConstructions()">Check Constructions</button>
        <div id="log-output"></div>
    </div>
    
    <div id="game-container"></div>

    <!-- Load the main game -->
    <script type="module">
        import './src/main.js';
        
        // Wait for game to initialize
        setTimeout(() => {
            console.log('🎮 Game should be loaded, running initial check...');
            checkActiveConstructions();
        }, 2000);
    </script>

    <script>
        function log(message) {
            const output = document.getElementById('log-output');
            const div = document.createElement('div');
            div.innerHTML = message;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
            console.log(message);
        }

        function checkActiveConstructions() {
            log('🔍 Checking active constructions...');
            
            if (typeof window !== 'undefined' && window.game) {
                const game = window.game;
                const activeBuildings = game.constructionManager.activeConstructions;
                
                log(`Found ${activeBuildings.length} active constructions`);
                
                if (activeBuildings.length > 0) {
                    const building = activeBuildings[0];
                    log(`🏗️ Building: ${building.name}`);
                    log(`Progress: ${building.currentConstructionProgress}/${building.constructionRequiredTime}`);
                    
                    if (building.progressBarMesh) {
                        log(`📊 Progress Bar: Scale X = ${building.progressBarMesh.scale.x}`);
                        log(`Position: (${building.progressBarMesh.position.x.toFixed(2)}, ${building.progressBarMesh.position.y.toFixed(2)}, ${building.progressBarMesh.position.z.toFixed(2)})`);
                    } else {
                        log('❌ No progress bar mesh found');
                    }
                } else {
                    log('ℹ️ No active constructions. Try placing a building first.');
                }
            } else {
                log('❌ Game not available');
            }
        }

        function testProgressBars() {
            log('🧪 Testing progress bar updates...');
            
            if (typeof window !== 'undefined' && window.game) {
                const game = window.game;
                const activeBuildings = game.constructionManager.activeConstructions;
                
                if (activeBuildings.length > 0) {
                    const building = activeBuildings[0];
                    log(`Testing building: ${building.name}`);
                    
                    if (building.progressBarMesh) {
                        const oldScaleX = building.progressBarMesh.scale.x;
                        log(`Current scale X: ${oldScaleX}`);
                        
                        // Manually update progress
                        const oldProgress = building.currentConstructionProgress;
                        building.currentConstructionProgress += 1000; // Add 1 second
                        
                        // Call update method
                        building._updateProgressBar();
                        
                        const newScaleX = building.progressBarMesh.scale.x;
                        log(`Progress: ${oldProgress} → ${building.currentConstructionProgress}`);
                        log(`Scale X: ${oldScaleX} → ${newScaleX}`);
                        
                        if (newScaleX !== oldScaleX) {
                            log('✅ Progress bar scale updated successfully!');
                        } else {
                            log('❌ Progress bar scale did not change');
                        }
                    } else {
                        log('❌ No progress bar mesh to test');
                    }
                } else {
                    log('❌ No active constructions to test');
                }
            } else {
                log('❌ Game not available');
            }
        }

        function startConstruction() {
            log('🏗️ Attempting to start construction...');
            
            if (typeof window !== 'undefined' && window.game) {
                const game = window.game;
                
                // Try to place a building at a random location
                const mapSize = 50;
                const x = Math.floor(Math.random() * mapSize);
                const z = Math.floor(Math.random() * mapSize);
                
                log(`Placing building at grid (${x}, ${z})`);
                
                try {
                    // Use the building placement system
                    const buildingType = 'HOUSE'; // Start with a simple house
                    game.placeBuildingAtGridPosition(buildingType, x, z);
                    log(`✅ Building placement attempted`);
                    
                    // Check after a short delay
                    setTimeout(() => {
                        checkActiveConstructions();
                    }, 500);
                } catch (error) {
                    log(`❌ Error placing building: ${error.message}`);
                }
            } else {
                log('❌ Game not available');
            }
        }

        // Auto-refresh construction status every 5 seconds
        setInterval(() => {
            if (document.getElementById('log-output').children.length > 0) {
                checkActiveConstructions();
            }
        }, 5000);
    </script>
</body>
</html>
