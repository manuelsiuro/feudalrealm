<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✅ queueBuilding API Test</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            padding: 20px; 
            background: #1e1e1e; 
            color: #fff; 
        }
        .test-result { 
            background: #2d2d2d; 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 8px; 
            border-left: 4px solid #007acc;
        }
        .success { border-left-color: #4caf50; }
        .error { border-left-color: #f44336; }
        .warning { border-left-color: #ff9800; }
        button { 
            padding: 12px 24px; 
            margin: 8px; 
            background: #007acc; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 14px;
        }
        button:hover { background: #005c99; }
        button:disabled { background: #666; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>🏗️ queueBuilding API Test</h1>
    <p>Testing the new queueBuilding method that was missing from the ConstructionManager.</p>
    
    <button id="testBtn">🧪 Test queueBuilding Method</button>
    <button id="clearBtn">🧹 Clear Results</button>
    
    <div id="results"></div>
    <canvas id="game-canvas" style="display: none;"></canvas>

    <script type="module">
        const testBtn = document.getElementById('testBtn');
        const clearBtn = document.getElementById('clearBtn');
        const results = document.getElementById('results');

        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${message}`;
            results.appendChild(div);
            console.log(message);
        }

        async function testQueueBuildingAPI() {
            testBtn.disabled = true;
            addResult('🚀 Starting queueBuilding API test...', 'info');

            try {
                // Initialize game
                addResult('📦 Importing and initializing game...', 'info');
                const { default: Game } = await import('./src/core/Game.js');
                const game = new Game();
                await game.init();

                // Wait for components
                let attempts = 0;
                while (attempts < 30 && (!game.constructionManager || !game.serfManager || !game.gameMap)) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    attempts++;
                }

                if (!game.constructionManager) {
                    throw new Error('ConstructionManager not initialized');
                }

                addResult('✅ Game components ready', 'success');

                // Test 1: Check if queueBuilding method exists
                addResult('🔍 Test 1: Checking if queueBuilding method exists...', 'info');
                if (typeof game.constructionManager.queueBuilding === 'function') {
                    addResult('✅ queueBuilding method found!', 'success');
                } else {
                    throw new Error('queueBuilding method not found');
                }

                // Test 2: Check getter methods
                addResult('🔍 Test 2: Checking getter methods...', 'info');
                const methods = ['getConstructionQueue', 'getActiveConstructions', 'getPlacedBuildings'];
                let allMethodsFound = true;
                
                methods.forEach(method => {
                    if (typeof game.constructionManager[method] === 'function') {
                        addResult(`✅ ${method} method found`, 'success');
                    } else {
                        addResult(`❌ ${method} method not found`, 'error');
                        allMethodsFound = false;
                    }
                });

                if (!allMethodsFound) {
                    throw new Error('Some getter methods are missing');
                }

                // Test 3: Test queueBuilding functionality
                addResult('🔍 Test 3: Testing queueBuilding functionality...', 'info');
                
                const initialQueueSize = game.constructionManager.getConstructionQueue().length;
                addResult(`📋 Initial queue size: ${initialQueueSize}`, 'info');

                // Try to queue a building
                const testX = 7, testZ = 7;
                if (game.constructionManager.isBuildable(testX, testZ)) {
                    try {
                        const building = game.constructionManager.queueBuilding('WOODCUTTERS_HUT', testX, testZ);
                        const newQueueSize = game.constructionManager.getConstructionQueue().length;
                        
                        addResult(`✅ Building queued successfully! ID: ${building.id}`, 'success');
                        addResult(`📋 Queue size increased: ${initialQueueSize} → ${newQueueSize}`, 'success');

                        // Test construction cycle
                        addResult('🔍 Test 4: Testing construction cycle...', 'info');
                        for (let i = 0; i < 5; i++) {
                            game.constructionManager.update(0.016);
                            await new Promise(resolve => setTimeout(resolve, 50));
                        }

                        const activeConstructions = game.constructionManager.getActiveConstructions().length;
                        const finalQueueSize = game.constructionManager.getConstructionQueue().length;
                        
                        addResult(`🏗️ Active constructions: ${activeConstructions}`, 'info');
                        addResult(`📋 Final queue size: ${finalQueueSize}`, 'info');

                        if (activeConstructions > 0 || finalQueueSize < newQueueSize) {
                            addResult('✅ Construction cycle is working!', 'success');
                        } else {
                            addResult('⚠️ No construction activity detected (this might be normal if no builders available)', 'warning');
                        }

                    } catch (error) {
                        addResult(`❌ queueBuilding failed: ${error.message}`, 'error');
                        throw error;
                    }
                } else {
                    addResult(`⚠️ Test location (${testX}, ${testZ}) is not buildable - testing error handling instead`, 'warning');
                    
                    try {
                        game.constructionManager.queueBuilding('WOODCUTTERS_HUT', testX, testZ);
                        addResult('❌ queueBuilding should have thrown an error for unbuildable location', 'error');
                    } catch (error) {
                        addResult(`✅ queueBuilding correctly rejected unbuildable location: ${error.message}`, 'success');
                    }
                }

                addResult('🎉 All queueBuilding API tests completed successfully!', 'success');

            } catch (error) {
                addResult(`❌ Test failed: ${error.message}`, 'error');
                console.error('Full error:', error);
            }

            testBtn.disabled = false;
        }

        function clearResults() {
            results.innerHTML = '';
        }

        testBtn.addEventListener('click', testQueueBuildingAPI);
        clearBtn.addEventListener('click', clearResults);

        addResult('🔧 queueBuilding API Tester Ready', 'info');
        addResult('Click "Test queueBuilding Method" to verify the new API works correctly.', 'info');
    </script>
</body>
</html>
