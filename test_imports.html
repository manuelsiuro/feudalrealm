<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module Import Test</title>
</head>
<body>
    <div id="output"></div>
    <script type="module">
        const output = document.getElementById('output');
        
        function log(message) {
            console.log(message);
            output.innerHTML += message + '<br>';
        }
        
        async function testImports() {
            log('Testing module imports one by one...');
            
            const imports = [
                { name: 'Three.js', path: 'three' },
                { name: 'mapConstants', path: '/src/config/mapConstants.js' },
                { name: 'resourceTypes', path: '/src/config/resourceTypes.js' },
                { name: 'pathfinding', path: '/src/utils/pathfinding.js' },
                { name: 'terrains', path: '/src/entities/terrains.js' },
                { name: 'resources', path: '/src/entities/resources.js' },
                { name: 'mapManager', path: '/src/core/mapManager.js' },
                { name: 'resourceManager', path: '/src/core/resourceManager.js' },
                { name: 'Renderer', path: '/src/core/Renderer.js' }
            ];
            
            for (const importItem of imports) {
                try {
                    log(`Testing ${importItem.name}...`);
                    const module = await import(importItem.path);
                    log(`✅ ${importItem.name} imported successfully`);
                } catch (error) {
                    log(`❌ Failed to import ${importItem.name}: ${error.message}`);
                    log(`Error details: ${error.stack}`);
                    break; // Stop on first error
                }
            }
            
            log('Import test complete');
        }
        
        testImports();
    </script>
</body>
</html>
