<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction System Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #fff; }
        .log { background: #2d2d2d; padding: 10px; border-radius: 5px; margin: 10px 0; }
        .success { color: #4caf50; }
        .error { color: #f44336; }
        .info { color: #2196f3; }
        .warning { color: #ff9800; }
        button { padding: 10px 20px; margin: 10px; background: #007acc; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #005c99; }
        button:disabled { background: #666; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>🏗️ Construction System Test</h1>
    <button id="runTest">Run Full Construction Test</button>
    <button id="stepTest">Step Through Test</button>
    <button id="clearLogs">Clear Logs</button>
    
    <div id="logs"></div>
    <canvas id="game-canvas" style="display: none;"></canvas>

    <script type="module">
        const logsDiv = document.getElementById('logs');
        const runTestBtn = document.getElementById('runTest');
        const stepTestBtn = document.getElementById('stepTest');
        const clearLogsBtn = document.getElementById('clearLogs');

        function log(message, type = 'info') {
            console.log(message);
            const logEntry = document.createElement('div');
            logEntry.className = `log ${type}`;
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.appendChild(logEntry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        let game = null;

        async function initializeGame() {
            try {
                log('🚀 Initializing game system...', 'info');
                
                const { default: Game } = await import('./src/core/Game.js');
                game = new Game();
                await game.init();
                
                // Wait for components
                let attempts = 0;
                while (attempts < 50 && (!game.constructionManager || !game.serfManager || !game.gameMap)) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    attempts++;
                }
                
                if (game.constructionManager && game.serfManager && game.gameMap) {
                    log('✅ Game initialized successfully', 'success');
                    log(`📍 Construction Manager: Ready`, 'success');
                    log(`👷 Serf Manager: Ready (${game.serfManager.serfs.length} serfs)`, 'success');
                    log(`🗺️ Game Map: Ready (${game.gameMap.width}x${game.gameMap.height})`, 'success');
                    return true;
                } else {
                    log('❌ Game components failed to initialize', 'error');
                    return false;
                }
            } catch (error) {
                log(`❌ Failed to initialize game: ${error.message}`, 'error');
                return false;
            }
        }

        async function testBuildingPlacement() {
            log('\n🧪 Testing Building Placement...', 'info');
            
            const testX = 7, testZ = 7;
            const canBuild = game.constructionManager.isBuildable(testX, testZ);
            log(`Can place building at (${testX}, ${testZ}): ${canBuild}`, canBuild ? 'success' : 'warning');
            
            if (canBuild) {
                try {
                    game.constructionManager.queueBuilding('WOODCUTTERS_HUT', testX, testZ);
                    const queueLength = game.constructionManager.getConstructionQueue().length;
                    log(`✅ Woodcutter's Hut queued successfully (Queue: ${queueLength})`, 'success');
                    return true;
                } catch (error) {
                    log(`❌ Failed to queue building: ${error.message}`, 'error');
                    return false;
                }
            }
            return false;
        }

        async function testConstructionCycle() {
            log('\n🧪 Testing Construction Cycle...', 'info');
            
            const initialQueue = game.constructionManager.getConstructionQueue().length;
            const initialActive = game.constructionManager.getActiveConstructions().length;
            
            log(`📋 Initial queue: ${initialQueue}`, 'info');
            log(`🏗️ Initial active constructions: ${initialActive}`, 'info');
            
            // Process several update cycles
            for (let i = 0; i < 10; i++) {
                game.constructionManager.update(0.016);
                await new Promise(resolve => setTimeout(resolve, 50));
            }
            
            const finalQueue = game.constructionManager.getConstructionQueue().length;
            const finalActive = game.constructionManager.getActiveConstructions().length;
            
            log(`📋 Final queue: ${finalQueue}`, 'info');
            log(`🏗️ Final active constructions: ${finalActive}`, 'info');
            
            if (finalActive > initialActive || finalQueue < initialQueue) {
                log('✅ Construction cycle is working!', 'success');
                return true;
            } else {
                log('⚠️ No construction activity detected', 'warning');
                return false;
            }
        }

        async function runFullTest() {
            runTestBtn.disabled = true;
            log('🎯 Starting Full Construction System Test', 'info');
            
            const gameReady = await initializeGame();
            if (!gameReady) {
                runTestBtn.disabled = false;
                return;
            }
            
            const placementWorking = await testBuildingPlacement();
            const cycleWorking = await testConstructionCycle();
            
            if (gameReady && placementWorking && cycleWorking) {
                log('🎉 All tests passed! Construction system is working correctly.', 'success');
            } else {
                log('⚠️ Some tests failed. Check the logs above for details.', 'warning');
            }
            
            runTestBtn.disabled = false;
        }

        // Event handlers
        runTestBtn.addEventListener('click', runFullTest);
        clearLogsBtn.addEventListener('click', () => {
            logsDiv.innerHTML = '';
        });

        stepTestBtn.addEventListener('click', async () => {
            if (!game) {
                await initializeGame();
            } else {
                await testConstructionCycle();
            }
        });

        // Auto-start
        log('🏗️ Construction System Test Ready', 'info');
        log('Click "Run Full Construction Test" to begin testing', 'info');
    </script>
</body>
</html>
