<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Integration Test</title>
    <link rel="stylesheet" href="src/style.css">
    <style>
        body { margin: 0; background: linear-gradient(135deg, #1a1a2e, #16213e); }
        .test-info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
            max-width: 300px;
        }
        .status-ok { color: #4CAF50; }
        .status-error { color: #f44336; }
        .status-warning { color: #FFC107; }
    </style>
</head>
<body>
    <div id="app">
        <canvas id="game-canvas"></canvas>
        <div id="ui-container"></div>
    </div>
    
    <div class="test-info">
        <div><strong>UI Integration Test</strong></div>
        <div id="ui-init-status">Initializing...</div>
        <div id="canvas-status">Canvas: Checking...</div>
        <div id="manager-status">Managers: Loading...</div>
        <div id="events-status">Events: Setting up...</div>
        <div id="render-status">Render: Starting...</div>
    </div>

    <script type="module">
        import { Game } from './src/core/Game.js';

        let game;
        const statusElements = {
            ui: document.getElementById('ui-init-status'),
            canvas: document.getElementById('canvas-status'),
            managers: document.getElementById('manager-status'),
            events: document.getElementById('events-status'),
            render: document.getElementById('render-status')
        };

        function updateStatus(element, text, type = 'ok') {
            element.innerHTML = `<span class="status-${type}">${text}</span>`;
        }

        async function testUIIntegration() {
            try {
                // Test canvas setup
                const canvas = document.getElementById('game-canvas');
                if (canvas) {
                    updateStatus(statusElements.canvas, '✅ Canvas element found');
                } else {
                    updateStatus(statusElements.canvas, '❌ Canvas missing', 'error');
                    return;
                }

                // Test UI container
                const uiContainer = document.getElementById('ui-container');
                if (uiContainer) {
                    updateStatus(statusElements.ui, '✅ UI container ready');
                } else {
                    updateStatus(statusElements.ui, '❌ UI container missing', 'error');
                    return;
                }

                // Initialize game
                updateStatus(statusElements.managers, '⏳ Loading game managers...', 'warning');
                
                game = new Game(canvas);
                
                // Wait a moment for initialization
                setTimeout(() => {
                    if (game.uiManager) {
                        updateStatus(statusElements.managers, '✅ Game managers loaded');
                        
                        // Test UI structure
                        const topBar = uiContainer.querySelector('[style*="grid-area: topbar"]');
                        const leftSidebar = uiContainer.querySelector('[style*="grid-area: left"]');
                        const rightSidebar = uiContainer.querySelector('[style*="grid-area: right"]');
                        
                        if (topBar && leftSidebar && rightSidebar) {
                            updateStatus(statusElements.ui, '✅ Modern UI layout active');
                        } else {
                            updateStatus(statusElements.ui, '⚠️ UI layout incomplete', 'warning');
                        }
                        
                        updateStatus(statusElements.events, '✅ Event system ready');
                        updateStatus(statusElements.render, '✅ Render loop active');
                        
                        // Test resource display
                        setTimeout(() => {
                            const resourceItems = uiContainer.querySelectorAll('.resource-item');
                            if (resourceItems.length > 0) {
                                console.log(`✅ Found ${resourceItems.length} resource items in UI`);
                            }
                        }, 1000);
                        
                    } else {
                        updateStatus(statusElements.managers, '❌ UI Manager failed to load', 'error');
                    }
                }, 500);

            } catch (error) {
                console.error('UI Integration Test Failed:', error);
                updateStatus(statusElements.managers, `❌ Error: ${error.message}`, 'error');
            }
        }

        // Run test when page loads
        window.addEventListener('load', testUIIntegration);

        // Monitor for any console errors
        window.addEventListener('error', (e) => {
            console.error('Runtime Error:', e.error);
            updateStatus(statusElements.render, `❌ Runtime error: ${e.error.message}`, 'error');
        });

        // Test responsiveness
        function testResponsive() {
            const width = window.innerWidth;
            const container = document.getElementById('ui-container');
            if (container && container.style.display === 'grid') {
                console.log(`✅ Responsive test passed at ${width}px`);
            }
        }

        window.addEventListener('resize', testResponsive);
        setTimeout(testResponsive, 2000);
    </script>
</body>
</html>
