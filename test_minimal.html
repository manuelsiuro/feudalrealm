<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Game Test</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div id="app">
        <canvas id="game-canvas"></canvas>
    </div>
    <script type="module">
        console.log('Minimal Game Test: Starting...');
        
        const appContainer = document.getElementById('app');
        const gameCanvas = document.getElementById('game-canvas');
        
        console.log('App container:', appContainer);
        console.log('Game canvas:', gameCanvas);
        
        if (!appContainer) {
            console.error('No app container found');
        } else if (!gameCanvas) {
            console.error('No game canvas found');
        } else {
            console.log('DOM elements found successfully');
            
            // Test Three.js import and renderer creation
            try {
                const THREE = await import('three');
                console.log('Three.js imported');
                
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x87CEEB);
                
                const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
                camera.position.set(0, 15, 15);
                
                const renderer = new THREE.WebGLRenderer({
                    canvas: gameCanvas,
                    antialias: true
                });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                
                console.log('Three.js renderer created successfully');
                
                // Add a simple cube to test rendering
                const geometry = new THREE.BoxGeometry(1, 1, 1);
                const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
                const cube = new THREE.Mesh(geometry, material);
                scene.add(cube);
                
                // Render the scene
                function animate() {
                    requestAnimationFrame(animate);
                    cube.rotation.x += 0.01;
                    cube.rotation.y += 0.01;
                    renderer.render(scene, camera);
                }
                animate();
                
                console.log('✅ Canvas is rendering successfully!');
                
            } catch (error) {
                console.error('❌ Error with Three.js setup:', error);
            }
        }
    </script>
</body>
</html>
