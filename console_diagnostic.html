<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Diagnostic</title>
    <style>
        body { 
            margin: 0; 
            font-family: Arial; 
            background: #222; 
            color: #fff;
            padding: 20px;
        }
        .console-output {
            background: #000;
            padding: 20px;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
            margin: 10px 0;
            max-height: 300px;
            overflow-y: auto;
        }
        .error { color: #ff6b6b; }
        .warn { color: #ffa500; }
        .info { color: #4ecdc4; }
        .log { color: #95e1d3; }
    </style>
</head>
<body>
    <h1>🔍 Console Diagnostic Tool</h1>
    <p>This page captures all console messages from the main game to help debug the camera issue.</p>
    
    <button onclick="openMainGame()">🎮 Open Main Game</button>
    <button onclick="clearConsole()">🧹 Clear Console</button>
    
    <div id="console-output" class="console-output">
        Console output will appear here...
    </div>

    <script>
        const consoleOutput = document.getElementById('console-output');
        
        // Capture console messages
        const originalConsole = {
            log: console.log,
            error: console.error,
            warn: console.warn,
            info: console.info
        };
        
        function addToOutput(type, ...args) {
            const timestamp = new Date().toLocaleTimeString();
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
            ).join(' ');
            
            const div = document.createElement('div');
            div.className = type;
            div.textContent = `[${timestamp}] ${type.toUpperCase()}: ${message}`;
            consoleOutput.appendChild(div);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
            
            // Also call original console method
            originalConsole[type](...args);
        }
        
        console.log = (...args) => addToOutput('log', ...args);
        console.error = (...args) => addToOutput('error', ...args);
        console.warn = (...args) => addToOutput('warn', ...args);
        console.info = (...args) => addToOutput('info', ...args);
        
        function openMainGame() {
            window.open('http://localhost:5173', '_blank');
        }
        
        function clearConsole() {
            consoleOutput.innerHTML = 'Console cleared...';
        }
        
        // Capture uncaught errors
        window.addEventListener('error', (event) => {
            addToOutput('error', `Uncaught Error: ${event.message} at ${event.filename}:${event.lineno}`);
        });
        
        window.addEventListener('unhandledrejection', (event) => {
            addToOutput('error', `Unhandled Promise Rejection: ${event.reason}`);
        });
        
        console.log('🔍 Console diagnostic tool ready!');
        console.log('📌 Open the main game to see console output here.');
    </script>
</body>
</html>
