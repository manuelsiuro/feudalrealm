<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castle.js Fix Verification</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .test-container {
            display: flex;
            gap: 20px;
            height: 80vh;
        }
        
        .game-section {
            flex: 2;
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .console-section {
            flex: 1;
            background: #000;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.4;
        }
        
        .controls {
            margin-bottom: 15px;
            padding: 10px;
            background: #333;
            border-radius: 4px;
        }
        
        .controls button {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 8px 16px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .controls button:hover {
            background: #45a049;
        }
        
        .controls button.secondary {
            background: #2196F3;
        }
        
        .controls button.secondary:hover {
            background: #1976D2;
        }
        
        #console-output {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .success { color: #4CAF50; }
        .error { color: #f44336; }
        .warning { color: #ff9800; }
        .info { color: #2196F3; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔧 Castle.js Fix Verification</h1>
        <p>Testing the fix for "TypeError: (intermediate value).update is not a function at Castle.js:109"</p>
    </div>
    
    <div class="controls">
        <button onclick="runTests()">🧪 Run All Tests</button>
        <button onclick="testCastleOnly()" class="secondary">🏰 Test Castle Only</button>
        <button onclick="showProductionUI()" class="secondary">📊 Show Production UI</button>
        <button onclick="clearConsole()" class="secondary">🗑️ Clear Console</button>
    </div>
    
    <div class="test-container">
        <div class="game-section">
            <iframe src="/" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>
        
        <div class="console-section">
            <h3>🖥️ Test Console Output</h3>
            <div id="console-output"></div>
        </div>
    </div>

    <script>
        let consoleOutput = document.getElementById('console-output');
        
        // Capture console output
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        function formatMessage(type, message) {
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'warn' ? 'warning' : 
                            message.includes('✅') ? 'success' : 
                            message.includes('ℹ️') ? 'info' : '';
            return `<span class="${className}">[${timestamp}] ${message}</span>\n`;
        }
        
        console.log = function(...args) {
            const message = args.join(' ');
            consoleOutput.innerHTML += formatMessage('log', message);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
            originalLog.apply(console, args);
        };
        
        console.error = function(...args) {
            const message = args.join(' ');
            consoleOutput.innerHTML += formatMessage('error', '❌ ERROR: ' + message);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
            originalError.apply(console, args);
        };
        
        console.warn = function(...args) {
            const message = args.join(' ');
            consoleOutput.innerHTML += formatMessage('warn', '⚠️ WARNING: ' + message);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
            originalWarn.apply(console, args);
        };
        
        function clearConsole() {
            consoleOutput.innerHTML = '';
        }
        
        function runTests() {
            console.log('🔧 Starting Castle.js Fix Verification Tests...');
            
            // Get the iframe's window
            const iframe = document.querySelector('iframe');
            const gameWindow = iframe.contentWindow;
            
            if (!gameWindow.testCastleFix) {
                console.log('⏳ Waiting for test framework to load...');
                setTimeout(runTests, 1000);
                return;
            }
            
            gameWindow.testCastleFix.runAllTests();
        }
        
        function testCastleOnly() {
            console.log('🏰 Testing Castle building specifically...');
            
            const iframe = document.querySelector('iframe');
            const gameWindow = iframe.contentWindow;
            
            if (!gameWindow.testCastleFix) {
                console.log('⏳ Waiting for test framework to load...');
                setTimeout(testCastleOnly, 1000);
                return;
            }
            
            gameWindow.testCastleFix.testCastleSpecifically();
        }
        
        function showProductionUI() {
            console.log('📊 Testing Production Chain UI...');
            
            const iframe = document.querySelector('iframe');
            const gameWindow = iframe.contentWindow;
            
            if (!gameWindow.testCastleFix) {
                console.log('⏳ Waiting for test framework to load...');
                setTimeout(showProductionUI, 1000);
                return;
            }
            
            gameWindow.testCastleFix.showProductionChainUI();
        }
        
        // Auto-run tests after page loads
        window.addEventListener('load', () => {
            setTimeout(() => {
                console.log('🎯 Page loaded, waiting for game initialization...');
                setTimeout(runTests, 2000);
            }, 1000);
        });
    </script>
</body>
</html>
