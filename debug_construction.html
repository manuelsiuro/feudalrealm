<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 Construction Debug Test</title>
    <style>
        body { 
            font-family: monospace; 
            padding: 20px; 
            background: #1e1e1e; 
            color: #fff; 
        }
        .log { 
            background: #2d2d2d; 
            padding: 10px; 
            margin: 5px 0; 
            border-radius: 4px; 
        }
        .success { background: #2d5016; }
        .error { background: #5d1a1a; }
        .warning { background: #5d4a1a; }
        button { 
            padding: 10px 20px; 
            margin: 5px; 
            background: #007acc; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
        }
        button:disabled { background: #666; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>🔧 Construction System Debug</h1>
    <button id="testBtn">Run Debug Test</button>
    <button id="clearBtn">Clear Log</button>
    
    <div id="log"></div>
    <canvas id="game-canvas" style="display: none;"></canvas>

    <script type="module">
        const logDiv = document.getElementById('log');
        const testBtn = document.getElementById('testBtn');
        const clearBtn = document.getElementById('clearBtn');

        function log(message, type = 'info') {
            console.log(message);
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(div);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function runDebugTest() {
            testBtn.disabled = true;
            log('🚀 Starting debug test...');

            try {
                // Step 1: Test basic import
                log('📦 Testing Game import...');
                const { default: Game } = await import('./src/core/Game.js');
                log('✅ Game class imported successfully', 'success');

                // Step 2: Test game creation
                log('🏗️ Creating Game instance...');
                const game = new Game();
                log('✅ Game instance created', 'success');

                // Step 3: Test game initialization
                log('🎮 Initializing game...');
                await game.init();
                log('✅ Game initialized', 'success');

                // Step 4: Test component availability
                log('🔍 Checking components...');
                const components = {
                    constructionManager: game.constructionManager,
                    serfManager: game.serfManager,
                    gameMap: game.gameMap,
                    resourceManager: game.resourceManager
                };

                for (const [name, component] of Object.entries(components)) {
                    if (component) {
                        log(`✅ ${name}: Available`, 'success');
                    } else {
                        log(`❌ ${name}: Missing`, 'error');
                    }
                }

                // Step 5: Test ConstructionManager methods
                if (game.constructionManager) {
                    log('🔍 Testing ConstructionManager methods...');
                    const methods = ['queueBuilding', 'getConstructionQueue', 'getActiveConstructions', 'getPlacedBuildings'];
                    
                    for (const method of methods) {
                        if (typeof game.constructionManager[method] === 'function') {
                            log(`✅ ${method}: Available`, 'success');
                        } else {
                            log(`❌ ${method}: Missing`, 'error');
                        }
                    }

                    // Step 6: Test basic construction functionality
                    log('🏗️ Testing construction functionality...');
                    
                    // Check initial state
                    const initialQueue = game.constructionManager.getConstructionQueue().length;
                    const initialActive = game.constructionManager.getActiveConstructions().length;
                    const initialBuildings = game.constructionManager.getPlacedBuildings().length;
                    
                    log(`📊 Initial state: Queue=${initialQueue}, Active=${initialActive}, Built=${initialBuildings}`);

                    // Find a buildable location
                    let buildableFound = false;
                    for (let x = 5; x < 10 && !buildableFound; x++) {
                        for (let z = 5; z < 10 && !buildableFound; z++) {
                            if (game.constructionManager.isBuildable(x, z)) {
                                try {
                                    log(`🎯 Testing queueBuilding at (${x}, ${z})...`);
                                    const building = game.constructionManager.queueBuilding('WOODCUTTERS_HUT', x, z);
                                    log(`✅ Building queued: ID=${building.id}, State=${building.currentConstructionState}`, 'success');
                                    
                                    const newQueue = game.constructionManager.getConstructionQueue().length;
                                    log(`📈 Queue size: ${initialQueue} → ${newQueue}`, 'success');
                                    
                                    buildableFound = true;
                                } catch (error) {
                                    log(`❌ queueBuilding failed: ${error.message}`, 'error');
                                }
                            }
                        }
                    }

                    if (!buildableFound) {
                        log('⚠️ No buildable locations found in test area', 'warning');
                    }

                    // Step 7: Test construction cycle
                    log('⚙️ Testing construction cycle...');
                    for (let i = 0; i < 3; i++) {
                        game.constructionManager.update(0.016);
                        await new Promise(resolve => setTimeout(resolve, 100));
                    }
                    
                    const finalQueue = game.constructionManager.getConstructionQueue().length;
                    const finalActive = game.constructionManager.getActiveConstructions().length;
                    const finalBuildings = game.constructionManager.getPlacedBuildings().length;
                    
                    log(`📊 Final state: Queue=${finalQueue}, Active=${finalActive}, Built=${finalBuildings}`);
                }

                log('🎉 Debug test completed!', 'success');

            } catch (error) {
                log(`❌ Debug test failed: ${error.message}`, 'error');
                console.error('Full error:', error);
            }

            testBtn.disabled = false;
        }

        function clearLog() {
            logDiv.innerHTML = '';
        }

        testBtn.addEventListener('click', runDebugTest);
        clearBtn.addEventListener('click', clearLog);

        log('🔧 Debug tester ready. Click "Run Debug Test" to start.');
    </script>
</body>
</html>
