<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controls Diagnostic</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #222;
            color: white;
        }
        .test-panel {
            background: #333;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        button {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        .error { color: #ff4444; }
        .success { color: #44ff44; }
        .warning { color: #ffaa44; }
        .info { color: #4444ff; }
        #log {
            background: #111;
            padding: 10px;
            border-radius: 4px;
            height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Controls Diagnostic Tool</h1>
    
    <div class="test-panel">
        <h2>Test Controls</h2>
        <div class="controls">
            <button onclick="testCanvasInteraction()">Test Canvas Events</button>
            <button onclick="testOrbitControls()">Test Orbit Controls</button>
            <button onclick="testUIOverlay()">Test UI Overlay</button>
            <button onclick="fixControls()">Fix Controls</button>
            <button onclick="clearLog()">Clear Log</button>
        </div>
    </div>
    
    <div class="test-panel">
        <h2>Log Output</h2>
        <div id="log"></div>
    </div>

    <script type="module">
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logDiv = document.getElementById('log');
            const colors = {
                error: '#ff4444',
                success: '#44ff44', 
                warning: '#ffaa44',
                info: '#4444ff'
            };
            
            logDiv.innerHTML += `<div style="color: ${colors[type]}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        window.log = log;
        window.clearLog = () => document.getElementById('log').innerHTML = '';
        
        window.testCanvasInteraction = async () => {
            log('Testing canvas interaction...', 'info');
            
            try {
                const canvas = document.getElementById('game-canvas');
                if (!canvas) {
                    log('❌ Canvas not found!', 'error');
                    return;
                }
                
                log('✅ Canvas found', 'success');
                log(`Canvas size: ${canvas.width}x${canvas.height}`, 'info');
                log(`Canvas client size: ${canvas.clientWidth}x${canvas.clientHeight}`, 'info');
                
                // Check if canvas can receive events
                const testHandler = (e) => {
                    log(`✅ Canvas click received at ${e.clientX}, ${e.clientY}`, 'success');
                    canvas.removeEventListener('click', testHandler);
                };
                
                canvas.addEventListener('click', testHandler);
                log('Click on the game area to test canvas events...', 'warning');
                
                // Auto-remove after 5 seconds
                setTimeout(() => {
                    canvas.removeEventListener('click', testHandler);
                    log('Canvas click test expired', 'warning');
                }, 5000);
                
            } catch (error) {
                log(`❌ Canvas test error: ${error.message}`, 'error');
            }
        };
        
        window.testOrbitControls = async () => {
            log('Testing OrbitControls...', 'info');
            
            try {
                if (!window.game) {
                    log('❌ Game instance not found!', 'error');
                    return;
                }
                
                const controls = window.game.controls;
                if (!controls) {
                    log('❌ Controls not found!', 'error');
                    return;
                }
                
                log('✅ Controls found', 'success');
                log(`Controls type: ${controls.constructor.name}`, 'info');
                log(`Controls enabled: ${controls.enabled}`, controls.enabled ? 'success' : 'error');
                log(`Controls enableRotate: ${controls.enableRotate}`, controls.enableRotate ? 'success' : 'error');
                log(`Controls enableZoom: ${controls.enableZoom}`, controls.enableZoom ? 'success' : 'error');
                log(`Controls enablePan: ${controls.enablePan}`, controls.enablePan ? 'success' : 'error');
                
                if (controls.domElement) {
                    log(`Controls DOM element: ${controls.domElement.tagName}#${controls.domElement.id}`, 'info');
                    log(`DOM element pointer events: ${getComputedStyle(controls.domElement).pointerEvents}`, 'info');
                } else {
                    log('❌ Controls DOM element not set!', 'error');
                }
                
                // Test programmatic control
                const initialAzimuth = controls.getAzimuthalAngle();
                log(`Initial azimuth: ${initialAzimuth}`, 'info');
                
                // Try to rotate
                if (controls.rotateLeft) {
                    controls.rotateLeft(0.1);
                    controls.update();
                    
                    setTimeout(() => {
                        const newAzimuth = controls.getAzimuthalAngle();
                        log(`New azimuth: ${newAzimuth}`, 'info');
                        if (Math.abs(initialAzimuth - newAzimuth) > 0.01) {
                            log('✅ Programmatic rotation works', 'success');
                        } else {
                            log('❌ Programmatic rotation failed', 'error');
                        }
                    }, 100);
                }
                
            } catch (error) {
                log(`❌ Controls test error: ${error.message}`, 'error');
            }
        };
        
        window.testUIOverlay = async () => {
            log('Testing UI overlay interference...', 'info');
            
            try {
                const uiOverlay = document.getElementById('ui-overlay');
                if (!uiOverlay) {
                    log('❌ UI overlay not found!', 'error');
                    return;
                }
                
                log('✅ UI overlay found', 'success');
                
                const overlayStyle = getComputedStyle(uiOverlay);
                log(`UI overlay pointer-events: ${overlayStyle.pointerEvents}`, 'info');
                log(`UI overlay z-index: ${overlayStyle.zIndex}`, 'info');
                log(`UI overlay position: ${overlayStyle.position}`, 'info');
                
                // Check UI panels
                const panels = uiOverlay.querySelectorAll('.themed-panel, [style*="pointer-events: auto"]');
                log(`Found ${panels.length} UI panels with pointer-events: auto`, 'info');
                
                panels.forEach((panel, index) => {
                    const rect = panel.getBoundingClientRect();
                    log(`Panel ${index + 1}: ${rect.width}x${rect.height} at (${rect.left}, ${rect.top})`, 'info');
                });
                
                // Check for elements covering the canvas
                const canvas = document.getElementById('game-canvas');
                if (canvas) {
                    const canvasRect = canvas.getBoundingClientRect();
                    log(`Canvas area: ${canvasRect.width}x${canvasRect.height} at (${canvasRect.left}, ${canvasRect.top})`, 'info');
                    
                    // Test center point
                    const centerX = canvasRect.left + canvasRect.width / 2;
                    const centerY = canvasRect.top + canvasRect.height / 2;
                    const elementAtCenter = document.elementFromPoint(centerX, centerY);
                    
                    if (elementAtCenter === canvas) {
                        log('✅ Canvas is accessible at center point', 'success');
                    } else {
                        log(`❌ Element at canvas center: ${elementAtCenter.tagName}#${elementAtCenter.id}`, 'error');
                    }
                }
                
            } catch (error) {
                log(`❌ UI overlay test error: ${error.message}`, 'error');
            }
        };
        
        window.fixControls = async () => {
            log('Attempting to fix controls...', 'info');
            
            try {
                if (!window.game) {
                    log('❌ Game instance not found!', 'error');
                    return;
                }
                
                const controls = window.game.controls;
                const canvas = document.getElementById('game-canvas');
                
                if (!controls || !canvas) {
                    log('❌ Controls or canvas not found!', 'error');
                    return;
                }
                
                // Re-enable controls
                controls.enabled = true;
                controls.enableRotate = true;
                controls.enableZoom = true;
                controls.enablePan = true;
                
                // Ensure canvas can receive events
                canvas.style.pointerEvents = 'auto';
                
                // Reattach controls to canvas if needed
                if (controls.domElement !== canvas) {
                    log('Reattaching controls to canvas...', 'warning');
                    controls.dispose();
                    
                    // Create new controls
                    const THREE = window.game.renderer.THREE || window.THREE;
                    if (THREE && THREE.OrbitControls) {
                        const newControls = new THREE.OrbitControls(window.game.camera, canvas);
                        newControls.enableDamping = true;
                        newControls.dampingFactor = 0.05;
                        newControls.minDistance = 5;
                        newControls.maxDistance = 100;
                        
                        window.game.controls = newControls;
                        window.game.renderer.controls = newControls;
                        
                        log('✅ Controls reattached', 'success');
                    } else {
                        log('❌ Cannot create new controls - THREE.OrbitControls not available', 'error');
                    }
                } else {
                    log('✅ Controls already attached to correct element', 'success');
                }
                
                // Force update
                controls.update();
                
                log('✅ Controls fix attempted', 'success');
                log('Try rotating/zooming the map now...', 'warning');
                
            } catch (error) {
                log(`❌ Fix controls error: ${error.message}`, 'error');
            }
        };
        
        // Auto-run initial tests
        setTimeout(() => {
            log('Starting automatic diagnostics...', 'info');
            testCanvasInteraction();
            setTimeout(testOrbitControls, 1000);
            setTimeout(testUIOverlay, 2000);
        }, 1000);
    </script>
</body>
</html>
