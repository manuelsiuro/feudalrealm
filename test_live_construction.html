<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction Cycle Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #gameCanvas {
            display: block;
            background-color: #34495e;
        }
        
        #testPanel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 8px;
            min-width: 250px;
            font-size: 14px;
            z-index: 1000;
        }
        
        .test-button {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 5px 0;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 12px;
        }
        
        .test-button:hover {
            background: #2980b9;
        }
        
        .test-button:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
        }
        
        #log {
            background: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            padding: 10px;
            height: 200px;
            overflow-y: auto;
            margin-top: 10px;
            border-radius: 4px;
            white-space: pre-wrap;
        }
        
        .status {
            background: #27ae60;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            margin: 5px 0;
            text-align: center;
        }
        
        .status.error {
            background: #e74c3c;
        }
        
        .status.warning {
            background: #f39c12;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="testPanel">
        <h3>🏗️ Construction Test</h3>
        <div id="gameStatus" class="status">Loading...</div>
        
        <button id="testBtn" class="test-button" disabled>Run Construction Test</button>
        <button id="stateBtn" class="test-button" disabled>Check Game State</button>
        <button id="clearBtn" class="test-button">Clear Log</button>
        
        <div id="log"></div>
    </div>

    <script type="module">
        import { Game } from './src/core/Game.js';
        
        // Initialize the game
        const canvas = document.getElementById('gameCanvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const game = new Game(canvas);
        window.game = game; // Expose globally for testing
        
        // UI elements
        const gameStatus = document.getElementById('gameStatus');
        const testBtn = document.getElementById('testBtn');
        const stateBtn = document.getElementById('stateBtn');
        const clearBtn = document.getElementById('clearBtn');
        const log = document.getElementById('log');
        
        // Override console.log to capture output
        const originalLog = console.log;
        const originalError = console.error;
        
        function logToPanel(message, type = 'log') {
            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌' : type === 'warn' ? '⚠️' : '📝';
            log.textContent += `[${timestamp}] ${prefix} ${message}\n`;
            log.scrollTop = log.scrollHeight;
        }
        
        console.log = (...args) => {
            originalLog(...args);
            logToPanel(args.join(' '));
        };
        
        console.error = (...args) => {
            originalError(...args);
            logToPanel(args.join(' '), 'error');
        };
        
        // Wait for game to initialize
        let gameInitialized = false;
        
        function checkGameReady() {
            if (game && game.constructionManager && game.serfManager && !gameInitialized) {
                gameInitialized = true;
                gameStatus.textContent = 'Game Ready';
                gameStatus.className = 'status';
                testBtn.disabled = false;
                stateBtn.disabled = false;
                
                console.log('🎮 Game initialized successfully!');
                console.log('📊 Initial game state check...');
                checkGameState();
                
                // Load validation script
                const script = document.createElement('script');
                script.src = './validate_construction.js';
                script.onload = () => {
                    console.log('✅ Validation script loaded');
                };
                document.head.appendChild(script);
            }
        }
        
        // Check game readiness periodically
        const readyCheck = setInterval(() => {
            checkGameReady();
            if (gameInitialized) {
                clearInterval(readyCheck);
            }
        }, 100);
        
        // Event handlers
        testBtn.addEventListener('click', () => {
            if (window.testConstruction) {
                console.log('🚀 Starting construction test...');
                window.testConstruction();
            } else {
                console.error('❌ Test function not available');
            }
        });
        
        stateBtn.addEventListener('click', () => {
            if (window.checkGameState) {
                window.checkGameState();
            } else {
                checkGameState();
            }
        });
        
        clearBtn.addEventListener('click', () => {
            log.textContent = '';
        });
        
        // Manual game state check function
        function checkGameState() {
            if (!game) {
                console.log('❌ Game not loaded');
                return;
            }
            
            const buildings = game.constructionManager?.getAllBuildings() || [];
            const serfs = game.serfManager?.serfs || [];
            const queue = game.constructionManager?.constructionQueue || [];
            const active = game.constructionManager?.activeConstructions || new Map();
            
            console.log(`🎮 Game State:
    - Buildings: ${buildings.length}
    - Serfs: ${serfs.length}
    - Construction Queue: ${queue.length}
    - Active Constructions: ${active.size}`);
            
            buildings.forEach((b, i) => {
                console.log(`  Building ${i + 1}: ${b.type} at (${b.gridX}, ${b.gridZ}) - ${b.state}`);
            });
            
            serfs.forEach((s, i) => {
                console.log(`  Serf ${i + 1}: ${s.profession} at (${s.gridX}, ${s.gridZ}) - ${s.currentState?.constructor.name || 'Unknown'}`);
            });
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        console.log('🎯 Test page loaded, waiting for game initialization...');
    </script>
</body>
</html>
