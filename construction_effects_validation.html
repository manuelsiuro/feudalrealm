<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction Effects Validation</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .test-panel {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .test-item {
            background: #3a3a3a;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
        }
        
        .test-item.warning {
            border-left-color: #FF9800;
        }
        
        .test-item.error {
            border-left-color: #f44336;
        }
        
        .status {
            font-weight: bold;
            margin-top: 10px;
        }
        
        .status.pass { color: #4CAF50; }
        .status.warning { color: #FF9800; }
        .status.fail { color: #f44336; }
        
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        
        button:hover {
            background: #45a049;
        }
        
        button.warning {
            background: #FF9800;
        }
        
        button.danger {
            background: #f44336;
        }
        
        #gameCanvas {
            border: 2px solid #555;
            margin: 20px 0;
        }
        
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        
        .effects-panel {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
        
        .effects-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        
        .stats-display {
            font-family: monospace;
            background: #1a1a1a;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏗️ Construction Effects System Validation</h1>
        <p>Testing advanced construction visual effects integration</p>
    </div>

    <div class="test-panel">
        <h2>System Status</h2>
        <div class="test-grid" id="systemTests">
            <!-- Tests will be populated by JavaScript -->
        </div>
    </div>

    <div class="controls">
        <button onclick="initializeGame()" id="initBtn">Initialize Game</button>
        <button onclick="testConstructionEffects()" id="testBtn" disabled>Test Construction Effects</button>
        <button onclick="placeBuildingForTest()" id="placeBtn" disabled>Place Test Building</button>
        <button onclick="toggleAllEffects()" id="toggleBtn" disabled>Toggle All Effects</button>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div class="effects-panel">
        <h3>Construction Effects Controls</h3>
        <div class="effects-controls" id="effectsControls">
            <!-- Effect controls will be populated -->
        </div>
        <div class="stats-display" id="effectsStats">
            No effects manager loaded...
        </div>
    </div>

    <div class="test-panel">
        <h2>Test Log</h2>
        <div id="testLog" style="height: 200px; overflow-y: auto; background: #1a1a1a; padding: 10px; border-radius: 5px; font-family: monospace;">
            <div>🏗️ Construction Effects Validation Ready</div>
        </div>
    </div>

    <script type="module">
        import Game from './src/core/Game.js';

        let game = null;
        let effectsManager = null;

        window.log = function(message, type = 'info') {
            const logDiv = document.getElementById('testLog');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#f44336' : type === 'warning' ? '#FF9800' : type === 'success' ? '#4CAF50' : '#fff';
            logDiv.innerHTML += `<div style="color: ${color}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[ConstructionEffects] ${message}`);
        };

        window.initializeGame = async function() {
            try {
                log('🎮 Initializing game system...', 'info');
                
                const canvas = document.getElementById('gameCanvas');
                game = new Game(canvas);
                
                // Wait for initialization
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                if (game.constructionManager && game.constructionManager.constructionEffectsManager) {
                    effectsManager = game.constructionManager.constructionEffectsManager;
                    log('✅ ConstructionEffectsManager successfully loaded!', 'success');
                    
                    // Enable test buttons
                    document.getElementById('testBtn').disabled = false;
                    document.getElementById('placeBtn').disabled = false;
                    document.getElementById('toggleBtn').disabled = false;
                    
                    // Setup effect controls
                    setupEffectControls();
                    updateStats();
                    
                    // Run system tests
                    runSystemTests();
                } else {
                    log('❌ ConstructionEffectsManager not found!', 'error');
                }
                
                log('🎮 Game initialization complete', 'success');
                
            } catch (error) {
                log(`❌ Game initialization failed: ${error.message}`, 'error');
                console.error('Game initialization error:', error);
            }
        };

        window.testConstructionEffects = function() {
            if (!effectsManager) {
                log('❌ Effects manager not available', 'error');
                return;
            }

            log('🧪 Testing construction effects system...', 'info');
            
            try {
                // Test configuration
                log(`📋 Configuration test: ${JSON.stringify(effectsManager.config)}`, 'info');
                
                // Test toggle methods
                effectsManager.toggleDustParticles();
                effectsManager.toggleDustParticles(); // Toggle back
                log('✅ Dust particles toggle: PASS', 'success');
                
                effectsManager.toggleScaffolding();
                effectsManager.toggleScaffolding(); // Toggle back
                log('✅ Scaffolding toggle: PASS', 'success');
                
                effectsManager.toggleTransparency();
                effectsManager.toggleTransparency(); // Toggle back
                log('✅ Transparency toggle: PASS', 'success');
                
                // Test stats
                const stats = effectsManager.getStats();
                log(`📊 Current stats: ${JSON.stringify(stats)}`, 'info');
                
                log('✅ Construction effects system tests: PASS', 'success');
                updateStats();
                
            } catch (error) {
                log(`❌ Construction effects test failed: ${error.message}`, 'error');
            }
        };

        window.placeBuildingForTest = function() {
            if (!game || !game.constructionManager) {
                log('❌ Game or construction manager not available', 'error');
                return;
            }

            try {
                log('🏠 Placing test building for construction effects...', 'info');
                
                // Start placement mode for a simple building
                game.constructionManager.startPlacement('WOODCUTTERS_HUT');
                log('✅ Building placement mode started', 'success');
                
                // Simulate placement at center
                const worldPosition = { x: 0, y: 0, z: 0 };
                const placed = game.constructionManager.confirmPlacement(worldPosition);
                
                if (placed) {
                    log('✅ Test building placed successfully!', 'success');
                    log('🏗️ Construction effects should now be visible', 'info');
                } else {
                    log('⚠️ Building placement failed (normal if position invalid)', 'warning');
                }
                
                updateStats();
                
            } catch (error) {
                log(`❌ Building placement test failed: ${error.message}`, 'error');
            }
        };

        window.toggleAllEffects = function() {
            if (!effectsManager) {
                log('❌ Effects manager not available', 'error');
                return;
            }

            try {
                log('🔄 Toggling all construction effects...', 'info');
                
                effectsManager.config.isEnabled = !effectsManager.config.isEnabled;
                
                if (effectsManager.config.isEnabled) {
                    log('✅ Construction effects ENABLED', 'success');
                } else {
                    log('⚠️ Construction effects DISABLED', 'warning');
                }
                
                updateStats();
                
            } catch (error) {
                log(`❌ Toggle effects failed: ${error.message}`, 'error');
            }
        };

        function setupEffectControls() {
            const controlsDiv = document.getElementById('effectsControls');
            
            const controls = [
                { name: 'Dust Particles', key: 'showDustParticles', action: () => effectsManager.toggleDustParticles() },
                { name: 'Scaffolding', key: 'showScaffolding', action: () => effectsManager.toggleScaffolding() },
                { name: 'Transparency', key: 'showTransparency', action: () => effectsManager.toggleTransparency() },
                { name: 'Animations', key: 'showAnimations', action: () => effectsManager.config.showAnimations = !effectsManager.config.showAnimations }
            ];
            
            controls.forEach(control => {
                const button = document.createElement('button');
                button.textContent = control.name;
                button.onclick = () => {
                    control.action();
                    updateStats();
                    log(`🔄 Toggled ${control.name}`, 'info');
                };
                controlsDiv.appendChild(button);
            });
        }

        function updateStats() {
            if (!effectsManager) return;
            
            const stats = effectsManager.getStats();
            const statsDiv = document.getElementById('effectsStats');
            
            statsDiv.innerHTML = `
                <strong>Construction Effects Stats:</strong><br>
                Active Constructions: ${stats.activeConstructions}<br>
                Dust Systems: ${stats.dustSystems}<br>
                Scaffolding Systems: ${stats.scaffoldingSystems}<br>
                Enabled: ${stats.isEnabled ? '✅' : '❌'}<br>
                Dust Particles: ${stats.showDustParticles ? '✅' : '❌'}<br>
                Scaffolding: ${stats.showScaffolding ? '✅' : '❌'}<br>
                Transparency: ${stats.showTransparency ? '✅' : '❌'}
            `;
        }

        function runSystemTests() {
            const testsDiv = document.getElementById('systemTests');
            
            const tests = [
                {
                    name: 'ConstructionEffectsManager Import',
                    test: () => effectsManager !== null,
                    description: 'ConstructionEffectsManager class loaded successfully'
                },
                {
                    name: 'Scene Integration',
                    test: () => effectsManager.scene !== null,
                    description: 'Effects manager connected to THREE.js scene'
                },
                {
                    name: 'Effect Groups',
                    test: () => effectsManager.effectsGroup && effectsManager.dustGroup && effectsManager.scaffoldingGroup,
                    description: 'All effect groups created and added to scene'
                },
                {
                    name: 'Configuration System',
                    test: () => typeof effectsManager.config === 'object' && effectsManager.config.isEnabled !== undefined,
                    description: 'Configuration system properly initialized'
                },
                {
                    name: 'Toggle Methods',
                    test: () => typeof effectsManager.toggleDustParticles === 'function',
                    description: 'All toggle methods available'
                },
                {
                    name: 'Update System',
                    test: () => typeof effectsManager.update === 'function',
                    description: 'Update method available for animation loop'
                }
            ];
            
            tests.forEach(test => {
                const div = document.createElement('div');
                div.className = 'test-item';
                
                try {
                    const passed = test.test();
                    div.className += passed ? '' : ' error';
                    div.innerHTML = `
                        <h4>${test.name}</h4>
                        <p>${test.description}</p>
                        <div class="status ${passed ? 'pass' : 'fail'}">${passed ? 'PASS' : 'FAIL'}</div>
                    `;
                } catch (error) {
                    div.className += ' error';
                    div.innerHTML = `
                        <h4>${test.name}</h4>
                        <p>${test.description}</p>
                        <div class="status fail">ERROR: ${error.message}</div>
                    `;
                }
                
                testsDiv.appendChild(div);
            });
        }

        // Auto-update stats every 2 seconds
        setInterval(() => {
            if (effectsManager) {
                updateStats();
            }
        }, 2000);

        log('🚀 Construction Effects Validation page loaded', 'success');
        log('👆 Click "Initialize Game" to begin testing', 'info');
    </script>
</body>
</html>
