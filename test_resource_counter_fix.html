<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Counter Fix Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #2c3e50;
            color: white;
        }
        .log {
            background-color: #34495e;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-family: monospace;
        }
        .success {
            color: #2ecc71;
        }
        .error {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <h1>Resource Counter Fix Verification</h1>
    <div id="log-container">
        <div class="log">Loading test...</div>
    </div>

    <script type="module">
        const logContainer = document.getElementById('log-container');
        
        function log(message, type = 'info') {
            const logDiv = document.createElement('div');
            logDiv.className = `log ${type}`;
            logDiv.textContent = message;
            logContainer.appendChild(logDiv);
        }

        // Clear initial log
        logContainer.innerHTML = '';

        try {
            log('Starting resource counter fix test...', 'info');

            // Import modules
            const { RESOURCE_TYPES } = await import('./src/config/resourceTypes.js');
            log('✅ Resource types imported successfully', 'success');

            // Test the specific constants that were causing issues
            log(`IRON_BARS: ${RESOURCE_TYPES.IRON_BARS.key}`, 'info');
            log(`TOOL_AXE: ${RESOURCE_TYPES.TOOL_AXE.key}`, 'info');
            log(`TOOL_PICKAXE: ${RESOURCE_TYPES.TOOL_PICKAXE.key}`, 'info');

            // Test that these are not undefined
            if (RESOURCE_TYPES.IRON_BARS && RESOURCE_TYPES.TOOL_AXE && RESOURCE_TYPES.TOOL_PICKAXE) {
                log('✅ All resource type constants are defined', 'success');
            } else {
                log('❌ Some resource type constants are undefined', 'error');
            }

            // Create mock canvas and game for UIManager
            const mockCanvas = document.createElement('canvas');
            document.body.appendChild(mockCanvas);
            
            const mockGame = {
                resourceManager: {
                    onChange: (callback) => {
                        log('Resource manager onChange callback registered', 'info');
                    }
                }
            };

            // Import and test UIManager
            const { UIManager } = await import('./src/ui/UIManager.js');
            log('✅ UIManager imported successfully', 'success');

            const uiManager = new UIManager(mockCanvas, mockGame);
            log('✅ UIManager instance created successfully', 'success');

            if (uiManager.resourceCounterBar) {
                log('✅ Resource counter bar initialized', 'success');
            } else {
                log('❌ Resource counter bar not initialized', 'error');
            }

            // Test the updateResourceCounterBar method with mock data
            const mockStockpiles = {
                [RESOURCE_TYPES.WOOD.key]: 50,
                [RESOURCE_TYPES.STONE.key]: 25,
                [RESOURCE_TYPES.GRAIN.key]: 15,
                [RESOURCE_TYPES.IRON_ORE.key]: 30,
                [RESOURCE_TYPES.COAL_ORE.key]: 20,
                [RESOURCE_TYPES.GOLD_ORE.key]: 5,
                [RESOURCE_TYPES.PLANKS.key]: 40,
                [RESOURCE_TYPES.IRON_BARS.key]: 10,
                [RESOURCE_TYPES.TOOL_AXE.key]: 5,
                [RESOURCE_TYPES.TOOL_PICKAXE.key]: 3
            };

            uiManager.updateResourceCounterBar(mockStockpiles);
            log('✅ Resource counter updated successfully with mock data', 'success');

            // Check if resource counter is visible
            if (uiManager.resourceCounterBar && uiManager.resourceCounterBar.style.display !== 'none') {
                log('✅ Resource counter bar is visible', 'success');
            }

            log('🎉 All tests passed! The TypeError fix is working correctly.', 'success');

        } catch (error) {
            log(`❌ Error during testing: ${error.message}`, 'error');
            console.error('Full error:', error);
        }
    </script>
</body>
</html>
