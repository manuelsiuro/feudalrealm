<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Win #5: Construction Progress Indicators Test</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            display: flex;
            height: 100vh;
        }
        #gameContainer {
            flex: 1;
            position: relative;
        }
        #testPanel {
            width: 350px;
            background: #2a2a2a;
            padding: 20px;
            overflow-y: auto;
            border-left: 2px solid #444;
            position: absolute;
            right: 550px;
            z-index: 100;
            order: 2;
            transition: transform 0.3s ease;
        }
        .test-section {
            margin-bottom: 20px;
            padding: 15px;
            background: #333;
            border-radius: 5px;
        }
        .test-section h3 {
            margin: 0 0 10px 0;
            color: #4CAF50;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 3px;
        }
        .status.success { background: #4CAF50; }
        .status.error { background: #f44336; }
        .status.warning { background: #ff9800; }
        .status.info { background: #2196F3; }
        #log {
            background: #1a1a1a;
            color: #00ff00;
            padding: 10px;
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            border: 1px solid #444;
            margin-top: 10px;
        }
        .toggle-panel {
            position: fixed;
            top: 10px;
            right: 360px;
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            z-index: 101;
            transition: right 0.3s ease;
        }
        .toggle-panel.panel-hidden {
            right: 10px;
        }
        .toggle-panel:hover {
            background: #45a049;
        }
        #testPanel.hidden {
            transform: translateX(100%);
        }
    </style>
</head>
<body>
    <button class="toggle-panel" onclick="toggleTestPanel()">📊 Tests</button>
    <div id="gameContainer">
        <canvas id="game-canvas" style="display: block; width: 100%; height: 100%;"></canvas>
    </div>
    <div id="testPanel">
        <h2>🏗️ Quick Win #5 Test</h2>
        <p>Testing Construction Progress Indicators</p>
        
        <div class="test-section">
            <h3>Game Status</h3>
            <div id="gameStatus" class="status info">Loading...</div>
            <button onclick="checkGameState()">Refresh Status</button>
        </div>

        <div class="test-section">
            <h3>Construction Tests</h3>
            <button onclick="testInstantVisibility()">Test 1: Instant Visibility (Should Fail)</button>
            <button onclick="testProgressBars()">Test 2: Progress Bar System</button>
            <button onclick="testConstructionFlow()">Test 3: Full Construction Flow</button>
            <button onclick="testMultipleBuildings()">Test 4: Multiple Buildings</button>
        </div>

        <div class="test-section">
            <h3>Progress Monitoring</h3>
            <div id="progressInfo">No active constructions</div>
            <button onclick="startProgressMonitoring()">Start Monitoring</button>
            <button onclick="stopProgressMonitoring()">Stop Monitoring</button>
        </div>

        <div class="test-section">
            <h3>Quick Actions</h3>
            <button onclick="addResources()">Add Resources</button>
            <button onclick="clearAllBuildings()">Clear Test Buildings</button>
            <button onclick="resetTest()">Reset Test</button>
        </div>

        <div class="test-section">
            <h3>Test Log</h3>
            <div id="log"></div>
            <button onclick="clearLog()">Clear Log</button>
        </div>
    </div>

    <script type="module">
        import Game from './src/core/Game.js';
        import { RESOURCE_TYPES } from './src/config/resourceTypes.js';

        let game = null;
        let monitoringInterval = null;
        let testResults = [];

        // Initialize game
        async function initGame() {
            try {
                log('🎮 Initializing game...');
                
                // Check for required DOM elements
                const gameCanvas = document.getElementById('game-canvas');
                if (!gameCanvas) {
                    throw new Error('Game canvas not found');
                }
                
                game = new Game();
                await game.init();
                game.start(); // Start the game loop
                
                log('✅ Game initialized and started successfully');
                updateGameStatus('Game loaded and ready', 'success');
                window.game = game; // For console access

                // Add initial resources
                addResources();
                
            } catch (error) {
                log(`❌ Game initialization failed: ${error.message}`);
                updateGameStatus(`Failed to load: ${error.message}`, 'error');
            }
        }

        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${timestamp}] ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function updateGameStatus(message, type = 'info') {
            const statusDiv = document.getElementById('gameStatus');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }

        function updateProgressInfo(info) {
            document.getElementById('progressInfo').innerHTML = info;
        }

        // Test functions
        window.checkGameState = function() {
            if (!game) {
                updateGameStatus('Game not loaded', 'error');
                return;
            }

            const buildings = game.constructionManager?.getAllBuildings() || [];
            const serfs = game.serfManager?.serfs || [];
            const queue = game.constructionManager?.constructionQueue || [];
            const active = game.constructionManager?.activeConstructions || [];

            log(`📊 Game State:
    - Buildings: ${buildings.length}
    - Serfs: ${serfs.length}
    - Construction Queue: ${queue.length}
    - Active Constructions: ${active.length}`);

            updateGameStatus(`${buildings.length} buildings, ${serfs.length} serfs, ${queue.length} queued, ${active.length} active`, 'success');
        };

        window.testInstantVisibility = async function() {
            log('🧪 Test 1: Testing instant visibility (should fail)...');
            
            if (!game) {
                log('❌ Game not loaded');
                return;
            }

            // Find a buildable location
            let testX = 8, testZ = 8;
            for (let x = 5; x < 12; x++) {
                for (let z = 5; z < 12; z++) {
                    if (game.constructionManager.isBuildable(x, z)) {
                        testX = x;
                        testZ = z;
                        break;
                    }
                }
                if (testX !== 8) break;
            }

            log(`📍 Testing at grid position (${testX}, ${testZ})`);

            try {
                // Queue a building
                const building = game.constructionManager.queueBuilding('WOODCUTTERS_HUT', testX, testZ);
                log(`🏗️ Building queued: ${building.name} (ID: ${building.id})`);
                log(`📄 Initial state: ${building.currentConstructionState}`);
                log(`🎨 Model exists: ${building.model ? 'YES - ❌ FAIL' : 'NO - ✅ PASS'}`);

                if (building.model) {
                    log('❌ TEST FAILED: Building model exists immediately (should be null)');
                    testResults.push({ test: 'Instant Visibility', result: 'FAIL', reason: 'Model created immediately' });
                } else {
                    log('✅ TEST PASSED: Building model is null initially');
                    testResults.push({ test: 'Instant Visibility', result: 'PASS', reason: 'Model correctly delayed' });
                }

            } catch (error) {
                log(`❌ Test failed with error: ${error.message}`);
                testResults.push({ test: 'Instant Visibility', result: 'ERROR', reason: error.message });
            }
        };

        window.testProgressBars = async function() {
            log('🧪 Test 2: Testing progress bar system...');
            
            if (!game) {
                log('❌ Game not loaded');
                return;
            }

            // Find a buildable location
            let testX = 10, testZ = 8;
            for (let x = 8; x < 15; x++) {
                for (let z = 6; z < 12; z++) {
                    if (game.constructionManager.isBuildable(x, z)) {
                        testX = x;
                        testZ = z;
                        break;
                    }
                }
                if (testX !== 10) break;
            }

            try {
                const building = game.constructionManager.queueBuilding('FORESTERS_HUT', testX, testZ);
                log(`🏗️ Building queued for progress test: ${building.name}`);

                // Wait for construction to start and monitor progress
                let attempts = 0;
                const maxAttempts = 60; // 30 seconds

                const checkProgress = () => {
                    attempts++;
                    
                    if (building.currentConstructionState === 'UNDER_CONSTRUCTION') {
                        log(`🎯 Construction started! Progress: ${(building.getConstructionProgress() * 100).toFixed(1)}%`);
                        log(`📊 Progress bar exists: ${building.progressBarGroup ? 'YES - ✅ PASS' : 'NO - ❌ FAIL'}`);
                        log(`🎨 Model exists: ${building.model ? 'YES - ✅ PASS' : 'NO - ❌ FAIL'}`);

                        if (building.progressBarGroup && building.model) {
                            log('✅ TEST PASSED: Progress bar and model created when construction started');
                            testResults.push({ test: 'Progress Bars', result: 'PASS', reason: 'Progress bar created correctly' });
                        } else {
                            log('❌ TEST FAILED: Missing progress bar or model during construction');
                            testResults.push({ test: 'Progress Bars', result: 'FAIL', reason: 'Missing visual elements' });
                        }
                        return;
                    }

                    if (building.currentConstructionState === 'CONSTRUCTED') {
                        log(`🎉 Construction completed! Progress bar removed: ${!building.progressBarGroup ? 'YES - ✅ PASS' : 'NO - ❌ FAIL'}`);
                        if (!building.progressBarGroup) {
                            log('✅ TEST PASSED: Progress bar cleaned up after completion');
                            testResults.push({ test: 'Progress Bars', result: 'PASS', reason: 'Progress bar correctly removed' });
                        } else {
                            log('❌ TEST FAILED: Progress bar not removed after completion');
                            testResults.push({ test: 'Progress Bars', result: 'FAIL', reason: 'Progress bar not cleaned up' });
                        }
                        return;
                    }

                    if (attempts < maxAttempts) {
                        setTimeout(checkProgress, 500);
                    } else {
                        log('⏰ Timeout waiting for construction to start');
                        testResults.push({ test: 'Progress Bars', result: 'TIMEOUT', reason: 'Construction did not start' });
                    }
                };

                setTimeout(checkProgress, 500);

            } catch (error) {
                log(`❌ Progress bar test failed: ${error.message}`);
                testResults.push({ test: 'Progress Bars', result: 'ERROR', reason: error.message });
            }
        };

        window.testConstructionFlow = async function() {
            log('🧪 Test 3: Testing full construction flow...');
            
            if (!game) {
                log('❌ Game not loaded');
                return;
            }

            // Find a buildable location
            let testX = 6, testZ = 10;
            for (let x = 4; x < 10; x++) {
                for (let z = 8; z < 14; z++) {
                    if (game.constructionManager.isBuildable(x, z)) {
                        testX = x;
                        testZ = z;
                        break;
                    }
                }
                if (testX !== 6) break;
            }

            try {
                const building = game.constructionManager.queueBuilding('QUARRY', testX, testZ);
                log(`🏗️ Starting full flow test with: ${building.name}`);
                
                const phases = {
                    'NEEDS_CONSTRUCTION': false,
                    'UNDER_CONSTRUCTION': false,
                    'CONSTRUCTED': false
                };

                let phaseChecks = 0;
                const maxChecks = 120; // 60 seconds

                const checkPhase = () => {
                    phaseChecks++;
                    const currentState = building.currentConstructionState;
                    
                    if (!phases[currentState] && currentState in phases) {
                        phases[currentState] = true;
                        log(`✅ Phase completed: ${currentState}`);
                        
                        if (currentState === 'UNDER_CONSTRUCTION') {
                            log(`   - Model created: ${building.model ? 'YES' : 'NO'}`);
                            log(`   - Progress bar: ${building.progressBarGroup ? 'YES' : 'NO'}`);
                            log(`   - Builder assigned: ${building.assignedBuilderId ? 'YES' : 'NO'}`);
                        }
                        
                        if (currentState === 'CONSTRUCTED') {
                            log(`   - Progress bar removed: ${!building.progressBarGroup ? 'YES' : 'NO'}`);
                            log(`   - Builder released: ${!building.assignedBuilderId ? 'YES' : 'NO'}`);
                            
                            const allPhases = Object.values(phases).every(phase => phase);
                            if (allPhases) {
                                log('🎉 ALL PHASES COMPLETED SUCCESSFULLY!');
                                testResults.push({ test: 'Construction Flow', result: 'PASS', reason: 'All phases completed correctly' });
                            } else {
                                log('❌ Not all phases completed');
                                testResults.push({ test: 'Construction Flow', result: 'FAIL', reason: 'Missing phases' });
                            }
                            return;
                        }
                    }

                    if (phaseChecks < maxChecks) {
                        setTimeout(checkPhase, 500);
                    } else {
                        log('⏰ Construction flow test timeout');
                        log(`Final phases: ${JSON.stringify(phases)}`);
                        testResults.push({ test: 'Construction Flow', result: 'TIMEOUT', reason: 'Did not complete all phases' });
                    }
                };

                setTimeout(checkPhase, 500);

            } catch (error) {
                log(`❌ Construction flow test failed: ${error.message}`);
                testResults.push({ test: 'Construction Flow', result: 'ERROR', reason: error.message });
            }
        };

        window.testMultipleBuildings = async function() {
            log('🧪 Test 4: Testing multiple buildings construction...');
            
            if (!game) {
                log('❌ Game not loaded');
                return;
            }

            const buildingTypes = ['BUILDERS_HUT', 'TRANSPORTER_HUT', 'SAWMILL'];
            const buildings = [];

            try {
                // Queue multiple buildings
                for (let i = 0; i < buildingTypes.length; i++) {
                    let testX = 12 + i * 2, testZ = 6 + i;
                    
                    // Find buildable location
                    for (let x = testX; x < testX + 3; x++) {
                        for (let z = testZ; z < testZ + 3; z++) {
                            if (game.constructionManager.isBuildable(x, z)) {
                                const building = game.constructionManager.queueBuilding(buildingTypes[i], x, z);
                                buildings.push(building);
                                log(`🏗️ Queued: ${building.name} at (${x}, ${z})`);
                                break;
                            }
                        }
                        if (buildings.length > i) break;
                    }
                }

                log(`📋 Monitoring ${buildings.length} buildings...`);

                let checkCount = 0;
                const maxChecks = 180; // 90 seconds

                const monitorBuildings = () => {
                    checkCount++;
                    let allCompleted = true;
                    let inProgress = 0;
                    let hasProgressBars = 0;

                    buildings.forEach((building, index) => {
                        const state = building.currentConstructionState;
                        if (state !== 'CONSTRUCTED') {
                            allCompleted = false;
                        }
                        if (state === 'UNDER_CONSTRUCTION') {
                            inProgress++;
                            if (building.progressBarGroup) {
                                hasProgressBars++;
                            }
                        }
                    });

                    if (inProgress > 0) {
                        log(`⚙️ ${inProgress} buildings in progress, ${hasProgressBars} with progress bars`);
                    }

                    if (allCompleted) {
                        log('🎉 All buildings completed!');
                        const hasAnyProgressBars = buildings.some(b => b.progressBarGroup);
                        if (!hasAnyProgressBars) {
                            log('✅ All progress bars cleaned up correctly');
                            testResults.push({ test: 'Multiple Buildings', result: 'PASS', reason: 'All buildings completed with proper cleanup' });
                        } else {
                            log('❌ Some progress bars not cleaned up');
                            testResults.push({ test: 'Multiple Buildings', result: 'FAIL', reason: 'Progress bars not cleaned up' });
                        }
                        return;
                    }

                    if (checkCount < maxChecks) {
                        setTimeout(monitorBuildings, 1000);
                    } else {
                        log('⏰ Multiple buildings test timeout');
                        testResults.push({ test: 'Multiple Buildings', result: 'TIMEOUT', reason: 'Not all buildings completed' });
                    }
                };

                setTimeout(monitorBuildings, 1000);

            } catch (error) {
                log(`❌ Multiple buildings test failed: ${error.message}`);
                testResults.push({ test: 'Multiple Buildings', result: 'ERROR', reason: error.message });
            }
        };

        window.startProgressMonitoring = function() {
            if (monitoringInterval) return;
            
            log('📊 Starting progress monitoring...');
            monitoringInterval = setInterval(() => {
                if (!game) return;

                const activeConstructions = game.constructionManager?.activeConstructions || [];
                if (activeConstructions.length === 0) {
                    updateProgressInfo('No active constructions');
                    return;
                }

                let info = '<h4>Active Constructions:</h4>';
                activeConstructions.forEach((building, index) => {
                    const progress = (building.getConstructionProgress() * 100).toFixed(1);
                    const hasProgressBar = building.progressBarGroup ? '🟢' : '🔴';
                    const hasModel = building.model ? '🏗️' : '⬜';
                    
                    info += `<div class="progress-info">
                        ${index + 1}. ${building.name} (${building.id})<br>
                        Progress: ${progress}% ${hasProgressBar}<br>
                        Model: ${hasModel} | Builder: ${building.assignedBuilderId ? '👷' : '❌'}<br>
                        State: ${building.currentConstructionState}
                    </div>`;
                });

                updateProgressInfo(info);
            }, 500);
        };

        window.stopProgressMonitoring = function() {
            if (monitoringInterval) {
                clearInterval(monitoringInterval);
                monitoringInterval = null;
                log('📊 Progress monitoring stopped');
                updateProgressInfo('Monitoring stopped');
            }
        };

        window.addResources = function() {
            if (!game) return;
            
            game.resourceManager.addResource(RESOURCE_TYPES.WOOD, 100);
            game.resourceManager.addResource(RESOURCE_TYPES.STONE, 100);
            game.resourceManager.addResource(RESOURCE_TYPES.IRON_ORE, 50);
            log('💰 Added resources: 100 Wood, 100 Stone, 50 Iron Ore');
        };

        window.clearAllBuildings = function() {
            if (!game) return;
            
            log('🧹 Clearing test buildings...');
            // This would need to be implemented in the construction manager
            log('⚠️ Manual clearing not implemented - restart test instead');
        };

        window.resetTest = function() {
            log('🔄 Resetting test...');
            stopProgressMonitoring();
            testResults = [];
            location.reload();
        };

        window.clearLog = function() {
            document.getElementById('log').innerHTML = '';
        };

        // Toggle test panel visibility
        window.toggleTestPanel = function() {
            const panel = document.getElementById('testPanel');
            const toggleBtn = document.querySelector('.toggle-panel');
            
            panel.classList.toggle('hidden');
            toggleBtn.classList.toggle('panel-hidden');
            
            // Update button text based on panel state
            if (panel.classList.contains('hidden')) {
                toggleBtn.textContent = '📊 Show Tests';
            } else {
                toggleBtn.textContent = '📊 Tests';
            }
        };

        // Handle window resize
        window.addEventListener('resize', () => {
            if (game && game.renderer) {
                game.handleResize();
            }
        });

        // Initialize on load
        initGame();
    </script>
</body>
</html>
