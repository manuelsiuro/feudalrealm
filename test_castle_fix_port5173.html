<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castle.js Fix Test - Port 5173</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 8px;
        }
        
        .test-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            height: 80vh;
        }
        
        .game-frame {
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .console-panel {
            background: #000;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.4;
        }
        
        .controls {
            margin-bottom: 15px;
            padding: 10px;
            background: #333;
            border-radius: 4px;
        }
        
        .controls button {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 8px 16px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .controls button:hover {
            background: #45a049;
        }
        
        .controls button.blue {
            background: #2196F3;
        }
        
        .controls button.blue:hover {
            background: #1976D2;
        }
        
        #console-output {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .success { color: #4CAF50; }
        .error { color: #f44336; }
        .warning { color: #ff9800; }
        .info { color: #2196F3; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 Castle.js Fix Validation (Port 5173)</h1>
            <p>Testing the fix for "TypeError: (intermediate value).update is not a function at Castle.js:109"</p>
            <div class="controls">
                <button onclick="runValidation()">🧪 Run Validation</button>
                <button onclick="testCastleSpecific()" class="blue">🏰 Test Castle Only</button>
                <button onclick="showProductionUI()" class="blue">📊 Show Production UI</button>
                <button onclick="placeTestBuilding()" class="blue">🏗️ Place Test Building</button>
                <button onclick="clearConsole()" class="blue">🗑️ Clear Console</button>
            </div>
        </div>
        
        <div class="test-layout">
            <div class="game-frame">
                <iframe src="/" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
            
            <div class="console-panel">
                <h3>🖥️ Console Output</h3>
                <div id="console-output"></div>
            </div>
        </div>
    </div>

    <script>
        let consoleOutput = document.getElementById('console-output');
        let gameWindow = null;
        
        // Capture console output
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        function formatMessage(type, message) {
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'warn' ? 'warning' : 
                            message.includes('✅') ? 'success' : 
                            message.includes('ℹ️') ? 'info' : '';
            return `<span class="${className}">[${timestamp}] ${message}</span>\n`;
        }
        
        console.log = function(...args) {
            const message = args.join(' ');
            consoleOutput.innerHTML += formatMessage('log', message);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
            originalLog.apply(console, args);
        };
        
        console.error = function(...args) {
            const message = args.join(' ');
            consoleOutput.innerHTML += formatMessage('error', '❌ ERROR: ' + message);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
            originalError.apply(console, args);
        };
        
        console.warn = function(...args) {
            const message = args.join(' ');
            consoleOutput.innerHTML += formatMessage('warn', '⚠️ WARNING: ' + message);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
            originalWarn.apply(console, args);
        };
        
        function getGameWindow() {
            if (!gameWindow) {
                const iframe = document.querySelector('iframe');
                gameWindow = iframe.contentWindow;
            }
            return gameWindow;
        }
        
        function clearConsole() {
            consoleOutput.innerHTML = '';
        }
        
        async function runValidation() {
            console.log('🔧 Starting Castle.js Fix Validation...');
            
            const gw = getGameWindow();
            
            // Check if validation function is available
            if (gw.quickValidateCastleFix) {
                await gw.quickValidateCastleFix();
            } else {
                console.log('⏳ Validation function not loaded yet, waiting...');
                setTimeout(runValidation, 1000);
            }
        }
        
        function testCastleSpecific() {
            console.log('🏰 Testing Castle buildings specifically...');
            
            const gw = getGameWindow();
            if (!gw.game || !gw.game.productionChainManager) {
                console.log('⏳ Game not ready yet, waiting...');
                setTimeout(testCastleSpecific, 1000);
                return;
            }
            
            const buildings = gw.game.productionChainManager.buildings;
            const castles = Array.from(buildings.values()).filter(b => 
                b.type === 'CASTLE' || b.name.includes('Castle')
            );
            
            if (castles.length === 0) {
                console.log('ℹ️ No Castle buildings found to test');
                return;
            }
            
            castles.forEach((castle, index) => {
                try {
                    castle.update(100, Date.now());
                    console.log(`✅ Castle ${index + 1}: ${castle.name} - UPDATE SUCCESS!`);
                } catch (error) {
                    console.error(`❌ Castle ${index + 1}: ${castle.name} - ERROR: ${error.message}`);
                }
            });
        }
        
        function showProductionUI() {
            console.log('📊 Testing Production Chain UI...');
            
            const gw = getGameWindow();
            if (!gw.game?.ui?.productionChainUI) {
                console.log('⏳ ProductionChainUI not ready yet');
                return;
            }
            
            try {
                gw.game.ui.productionChainUI.show();
                console.log('✅ ProductionChainUI shown successfully');
                
                setTimeout(() => {
                    gw.game.ui.productionChainUI.hide();
                    console.log('✅ ProductionChainUI hidden successfully');
                }, 3000);
            } catch (error) {
                console.error(`❌ UI test failed: ${error.message}`);
            }
        }
        
        function placeTestBuilding() {
            console.log('🏗️ Attempting to place a test building...');
            
            const gw = getGameWindow();
            if (!gw.game?.constructionManager) {
                console.log('⏳ ConstructionManager not ready yet');
                return;
            }
            
            try {
                // Try to place a simple building for testing
                const result = gw.game.constructionManager.queueBuilding('WOODCUTTERS_HUT', 5, 5);
                if (result) {
                    console.log(`✅ Test building placed: ${result.name} (${result.id})`);
                    
                    // Test the update method immediately
                    setTimeout(() => {
                        try {
                            result.update(100, Date.now());
                            console.log(`✅ ${result.name} update() method works!`);
                        } catch (error) {
                            console.error(`❌ ${result.name} update() failed: ${error.message}`);
                        }
                    }, 500);
                } else {
                    console.log('❌ Failed to place test building');
                }
            } catch (error) {
                console.error(`❌ Building placement failed: ${error.message}`);
            }
        }
        
        // Auto-run validation after page loads
        window.addEventListener('load', () => {
            setTimeout(() => {
                console.log('🎯 Page loaded, starting auto-validation in 3 seconds...');
                setTimeout(runValidation, 3000);
            }, 1000);
        });
    </script>
</body>
</html>
