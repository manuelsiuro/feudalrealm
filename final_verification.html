<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✅ Construction System - FINAL VERIFICATION</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            padding: 20px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff; 
            min-height: 100vh;
            margin: 0;
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            background: rgba(255,255,255,0.1); 
            padding: 30px; 
            border-radius: 15px; 
            backdrop-filter: blur(10px);
        }
        h1 { text-align: center; margin-bottom: 30px; font-size: 2.5em; }
        .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin: 20px 0; }
        .status-card { 
            background: rgba(255,255,255,0.15); 
            padding: 20px; 
            border-radius: 10px; 
            border: 2px solid transparent;
        }
        .status-card.success { border-color: #4caf50; }
        .status-card.error { border-color: #f44336; }
        .status-card.warning { border-color: #ff9800; }
        .status-card.info { border-color: #2196f3; }
        
        .controls { text-align: center; margin: 30px 0; }
        button { 
            padding: 15px 30px; 
            margin: 10px; 
            background: rgba(255,255,255,0.2); 
            color: white; 
            border: 2px solid rgba(255,255,255,0.3); 
            border-radius: 25px; 
            cursor: pointer; 
            font-size: 16px;
            transition: all 0.3s ease;
        }
        button:hover { 
            background: rgba(255,255,255,0.3); 
            transform: translateY(-2px);
        }
        button:disabled { 
            background: rgba(255,255,255,0.1); 
            cursor: not-allowed; 
            transform: none;
        }
        
        .logs { 
            background: rgba(0,0,0,0.3); 
            padding: 20px; 
            border-radius: 10px; 
            max-height: 400px; 
            overflow-y: auto; 
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        .log-entry { margin: 5px 0; padding: 5px; border-radius: 3px; }
        .log-success { background: rgba(76, 175, 80, 0.2); }
        .log-error { background: rgba(244, 67, 54, 0.2); }
        .log-warning { background: rgba(255, 152, 0, 0.2); }
        .log-info { background: rgba(33, 150, 243, 0.2); }
        
        .progress { width: 100%; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; margin: 10px 0; }
        .progress-bar { height: 100%; background: #4caf50; border-radius: 3px; transition: width 0.3s ease; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏗️ Construction System - Final Verification</h1>
        
        <div class="status-grid">
            <div class="status-card info" id="importStatus">
                <h3>📦 Module Import</h3>
                <p id="importText">Ready to test...</p>
            </div>
            <div class="status-card info" id="gameStatus">
                <h3>🎮 Game Initialization</h3>
                <p id="gameText">Waiting...</p>
            </div>
            <div class="status-card info" id="constructionStatus">
                <h3>🏗️ Construction Manager</h3>
                <p id="constructionText">Not tested...</p>
            </div>
            <div class="status-card info" id="cycleStatus">
                <h3>⚙️ Construction Cycle</h3>
                <p id="cycleText">Not tested...</p>
            </div>
        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar" style="width: 0%"></div>
        </div>

        <div class="controls">
            <button id="runBtn">🚀 Run Complete Verification</button>
            <button id="stepBtn" disabled>📋 Step Through Tests</button>
            <button id="clearBtn">🧹 Clear Results</button>
        </div>

        <div class="logs" id="logs"></div>
    </div>

    <canvas id="game-canvas" style="display: none;"></canvas>

    <script type="module">
        const elements = {
            runBtn: document.getElementById('runBtn'),
            stepBtn: document.getElementById('stepBtn'),
            clearBtn: document.getElementById('clearBtn'),
            logs: document.getElementById('logs'),
            progressBar: document.getElementById('progressBar'),
            
            importStatus: document.getElementById('importStatus'),
            importText: document.getElementById('importText'),
            gameStatus: document.getElementById('gameStatus'),
            gameText: document.getElementById('gameText'),
            constructionStatus: document.getElementById('constructionStatus'),
            constructionText: document.getElementById('constructionText'),
            cycleStatus: document.getElementById('cycleStatus'),
            cycleText: document.getElementById('cycleText')
        };

        let currentStep = 0;
        let game = null;

        function updateProgress(step, total = 4) {
            const percent = (step / total) * 100;
            elements.progressBar.style.width = `${percent}%`;
        }

        function updateStatus(statusElement, textElement, message, type) {
            statusElement.className = `status-card ${type}`;
            textElement.textContent = message;
        }

        function log(message, type = 'info') {
            console.log(message);
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            elements.logs.appendChild(entry);
            elements.logs.scrollTop = elements.logs.scrollHeight;
        }

        async function step1_TestImport() {
            log('🔍 Step 1: Testing Game class import...', 'info');
            updateStatus(elements.importStatus, elements.importText, 'Testing import...', 'warning');
            
            try {
                const { default: Game } = await import('./src/core/Game.js');
                if (Game && typeof Game === 'function') {
                    log('✅ Game class imported successfully', 'success');
                    updateStatus(elements.importStatus, elements.importText, 'Import successful ✅', 'success');
                    updateProgress(1);
                    return Game;
                } else {
                    throw new Error('Game is not a valid constructor');
                }
            } catch (error) {
                log(`❌ Import failed: ${error.message}`, 'error');
                updateStatus(elements.importStatus, elements.importText, `Import failed: ${error.message}`, 'error');
                throw error;
            }
        }

        async function step2_InitializeGame(Game) {
            log('🔍 Step 2: Initializing game...', 'info');
            updateStatus(elements.gameStatus, elements.gameText, 'Initializing...', 'warning');
            
            try {
                game = new Game();
                await game.init();
                
                // Wait for components
                let attempts = 0;
                while (attempts < 30 && (!game.constructionManager || !game.serfManager || !game.gameMap)) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    attempts++;
                }

                if (game.constructionManager && game.serfManager && game.gameMap) {
                    log('✅ Game initialized with all components', 'success');
                    updateStatus(elements.gameStatus, elements.gameText, 'All components ready ✅', 'success');
                    updateProgress(2);
                    return true;
                } else {
                    throw new Error('Some game components failed to initialize');
                }
            } catch (error) {
                log(`❌ Game initialization failed: ${error.message}`, 'error');
                updateStatus(elements.gameStatus, elements.gameText, `Init failed: ${error.message}`, 'error');
                throw error;
            }
        }

        async function step3_TestConstruction() {
            log('🔍 Step 3: Testing construction system...', 'info');
            updateStatus(elements.constructionStatus, elements.constructionText, 'Testing placement...', 'warning');
            
            try {
                // Test building placement
                const testX = 6, testZ = 6;
                const canBuild = game.constructionManager.isBuildable(testX, testZ);
                log(`Can build at (${testX}, ${testZ}): ${canBuild}`, 'info');

                if (canBuild) {
                    game.constructionManager.queueBuilding('WOODCUTTERS_HUT', testX, testZ);
                    const queueLength = game.constructionManager.getConstructionQueue().length;
                    log(`✅ Building queued successfully (Queue: ${queueLength})`, 'success');
                    updateStatus(elements.constructionStatus, elements.constructionText, `Building queued ✅ (${queueLength} in queue)`, 'success');
                } else {
                    log('⚠️ Cannot place building at test location', 'warning');
                    updateStatus(elements.constructionStatus, elements.constructionText, 'Placement validation works ✅', 'success');
                }
                
                updateProgress(3);
                return true;
            } catch (error) {
                log(`❌ Construction test failed: ${error.message}`, 'error');
                updateStatus(elements.constructionStatus, elements.constructionText, `Test failed: ${error.message}`, 'error');
                throw error;
            }
        }

        async function step4_TestCycle() {
            log('🔍 Step 4: Testing construction cycle...', 'info');
            updateStatus(elements.cycleStatus, elements.cycleText, 'Processing cycle...', 'warning');
            
            try {
                const initialQueue = game.constructionManager.getConstructionQueue().length;
                const initialActive = game.constructionManager.getActiveConstructions().length;
                
                // Process construction updates
                for (let i = 0; i < 10; i++) {
                    game.constructionManager.update(0.016);
                    await new Promise(resolve => setTimeout(resolve, 50));
                }
                
                const finalQueue = game.constructionManager.getConstructionQueue().length;
                const finalActive = game.constructionManager.getActiveConstructions().length;
                
                log(`Construction processing: Queue ${initialQueue}→${finalQueue}, Active ${initialActive}→${finalActive}`, 'info');
                log('✅ Construction cycle is functional', 'success');
                updateStatus(elements.cycleStatus, elements.cycleText, `Cycle working ✅ (${finalActive} active)`, 'success');
                updateProgress(4);
                return true;
            } catch (error) {
                log(`❌ Construction cycle test failed: ${error.message}`, 'error');
                updateStatus(elements.cycleStatus, elements.cycleText, `Cycle failed: ${error.message}`, 'error');
                throw error;
            }
        }

        async function runCompleteVerification() {
            elements.runBtn.disabled = true;
            elements.stepBtn.disabled = true;
            log('🚀 Starting complete construction system verification...', 'info');

            try {
                const Game = await step1_TestImport();
                await step2_InitializeGame(Game);
                await step3_TestConstruction();
                await step4_TestCycle();
                
                log('🎉 ALL VERIFICATION TESTS PASSED!', 'success');
                log('The construction system is fully operational and ready for use.', 'success');
                
            } catch (error) {
                log('❌ Verification failed. Check the status cards above for details.', 'error');
            }
            
            elements.runBtn.disabled = false;
            elements.stepBtn.disabled = false;
        }

        async function runStepTest() {
            elements.stepBtn.disabled = true;
            
            try {
                switch (currentStep) {
                    case 0:
                        await step1_TestImport();
                        currentStep = 1;
                        break;
                    case 1:
                        if (!game) {
                            const { default: Game } = await import('./src/core/Game.js');
                            await step2_InitializeGame(Game);
                        }
                        currentStep = 2;
                        break;
                    case 2:
                        await step3_TestConstruction();
                        currentStep = 3;
                        break;
                    case 3:
                        await step4_TestCycle();
                        currentStep = 0; // Reset
                        break;
                }
            } catch (error) {
                log(`Step ${currentStep + 1} failed: ${error.message}`, 'error');
            }
            
            elements.stepBtn.disabled = false;
        }

        function clearResults() {
            elements.logs.innerHTML = '';
            currentStep = 0;
            game = null;
            updateProgress(0);
            
            // Reset all status cards
            updateStatus(elements.importStatus, elements.importText, 'Ready to test...', 'info');
            updateStatus(elements.gameStatus, elements.gameText, 'Waiting...', 'info');
            updateStatus(elements.constructionStatus, elements.constructionText, 'Not tested...', 'info');
            updateStatus(elements.cycleStatus, elements.cycleText, 'Not tested...', 'info');
            
            log('🧹 Results cleared. Ready for new test.', 'info');
        }

        // Event listeners
        elements.runBtn.addEventListener('click', runCompleteVerification);
        elements.stepBtn.addEventListener('click', runStepTest);
        elements.clearBtn.addEventListener('click', clearResults);

        // Initialize
        log('✨ Final Verification System Ready', 'info');
        log('Click "Run Complete Verification" to test the entire construction system.', 'info');
    </script>
</body>
</html>
