<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Migration Test</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a1a;
            color: #00ff00;
            padding: 20px;
        }
        .test-result {
            margin: 10px 0;
            padding: 5px;
        }
        .success { color: #00ff00; }
        .error { color: #ff4444; }
        .info { color: #4444ff; }
    </style>
</head>
<body>
    <h1>Resource Types Migration Test</h1>
    <div id="results"></div>
    
    <script type="module">
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            document.getElementById('results').appendChild(div);
            console.log(message);
        }

        async function runTests() {
            try {
                // Test 1: Import resource types
                const { RESOURCE_TYPES } = await import('./src/config/resourceTypes.js');
                log('✅ RESOURCE_TYPES imported successfully', 'success');

                // Test 2: Verify structure
                const testResource = RESOURCE_TYPES.WOOD;
                if (testResource && testResource.key && testResource.name && testResource.icon) {
                    log(`✅ WOOD resource has new structure: key=${testResource.key}, name=${testResource.name}, icon=${testResource.icon}`, 'success');
                } else {
                    log('❌ WOOD resource missing required properties', 'error');
                    return;
                }

                // Test 3: Test all resources have the new structure
                let allValid = true;
                let count = 0;
                for (const [name, resource] of Object.entries(RESOURCE_TYPES)) {
                    count++;
                    if (!resource.key || !resource.name || !resource.icon) {
                        log(`❌ ${name} missing required properties`, 'error');
                        allValid = false;
                    }
                }

                if (allValid) {
                    log(`✅ All ${count} resource types have the required structure`, 'success');
                } else {
                    log('❌ Some resource types are missing required properties', 'error');
                }

                // Test 4: Import and test ResourceManager
                const resourceManagerModule = await import('./src/core/resourceManager.js');
                const resourceManager = resourceManagerModule.default;
                log('✅ ResourceManager imported successfully', 'success');

                // Test 5: Test stockpiles initialization
                const stockpiles = resourceManager.getAllStockpiles();
                const expectedKeys = ['WOOD', 'STONE', 'GRAIN', 'TOOL_AXE'];
                let stockpilesValid = true;
                
                for (const key of expectedKeys) {
                    if (stockpiles.hasOwnProperty(key)) {
                        log(`✅ Stockpile for ${key} initialized: ${stockpiles[key]}`, 'success');
                    } else {
                        log(`❌ Missing stockpile for ${key}`, 'error');
                        stockpilesValid = false;
                    }
                }

                if (stockpilesValid) {
                    log('✅ ResourceManager stockpiles correctly use .key properties', 'success');
                }

                // Test 6: Test building data
                const { BUILDING_DATA } = await import('./src/config/buildingData.js');
                log('✅ BUILDING_DATA imported successfully', 'success');

                // Check a building's cost structure
                const lumbermillCost = BUILDING_DATA.LUMBERMILL.cost;
                if (lumbermillCost && lumbermillCost.hasOwnProperty('WOOD')) {
                    log(`✅ LUMBERMILL cost uses key format: WOOD cost = ${lumbermillCost.WOOD}`, 'success');
                } else {
                    log('❌ LUMBERMILL cost structure incorrect', 'error');
                }

                log('🎉 Resource migration test completed!', 'success');

            } catch (error) {
                log(`❌ Test failed with error: ${error.message}`, 'error');
                console.error('Full error:', error);
            }
        }

        runTests();
    </script>
</body>
</html>
