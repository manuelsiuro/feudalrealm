<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Controls Functionality</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
        }
        .test-panel {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .success { background: #2d5a2d; }
        .error { background: #5a2d2d; }
        .warning { background: #5a4d2d; }
        .info { background: #2d4d5a; }
        button {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #357abd; }
        #gameFrame {
            width: 100%;
            height: 600px;
            border: 2px solid #444;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>🎮 Feudal Realm Manager - Controls Test</h1>
    
    <div class="test-panel">
        <h2>Control Tests</h2>
        <button onclick="testRotation()">Test Map Rotation</button>
        <button onclick="testZoom()">Test Zoom</button>
        <button onclick="testBuildingPlacement()">Test Building Placement</button>
        <button onclick="runAllTests()">Run All Tests</button>
        <div id="testResults"></div>
    </div>

    <div class="test-panel">
        <h2>Game Instance</h2>
        <iframe id="gameFrame" src="http://localhost:5173"></iframe>
    </div>

    <script>
        let testResults = document.getElementById('testResults');

        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = `${new Date().toLocaleTimeString()}: ${message}`;
            testResults.appendChild(div);
        }

        function testRotation() {
            addResult('🔄 Testing Map Rotation...', 'info');
            addResult('✓ Try dragging on the map to rotate the camera', 'success');
            addResult('→ Expected: Camera should rotate around the scene when you drag with the mouse', 'info');
        }

        function testZoom() {
            addResult('🔍 Testing Zoom...', 'info');
            addResult('✓ Try scrolling with mouse wheel over the map', 'success');
            addResult('→ Expected: Camera should zoom in/out smoothly', 'info');
        }

        function testBuildingPlacement() {
            addResult('🏠 Testing Building Placement...', 'info');
            addResult('✓ Try clicking on the map (short click, don\'t drag)', 'success');
            addResult('→ Expected: Buildings should be placed where you click', 'info');
        }

        function runAllTests() {
            testResults.innerHTML = '';
            addResult('🚀 Starting comprehensive control tests...', 'info');
            
            setTimeout(() => testRotation(), 500);
            setTimeout(() => testZoom(), 1000);
            setTimeout(() => testBuildingPlacement(), 1500);
            
            setTimeout(() => {
                addResult('📋 Test Summary:', 'info');
                addResult('• Map rotation should work with mouse drag', 'info');
                addResult('• Zoom should work with mouse wheel', 'info');
                addResult('• Building placement should work with single clicks', 'info');
                addResult('• Camera controls should not interfere with building placement', 'warning');
            }, 2000);
        }

        // Auto-start tests when page loads
        window.onload = () => {
            addResult('🎯 Controls test page loaded. Game should be running in the frame below.', 'success');
            addResult('📝 Manual testing required - please interact with the game to verify controls work.', 'warning');
        };
    </script>
</body>
</html>
