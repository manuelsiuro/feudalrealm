<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serf Assignment Diagnostic Test</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: #1a1a1a; 
            color: #fff; 
            display: flex;
        }
        
        #gameContainer {
            flex: 1;
            position: relative;
        }
        
        #game-canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        
        #diagnosticSidebar {
            width: 400px;
            background: #1a1a1a;
            border-left: 2px solid #444;
            height: 100vh;
            overflow-y: auto;
            padding: 10px;
            box-sizing: border-box;
        }
        
        .diagnostic-panel {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }
        .status-good { color: #4CAF50; }
        .status-warning { color: #FF9800; }
        .status-error { color: #F44336; }
        .building-info {
            background: #333;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .serf-info {
            background: #444;
            padding: 8px;
            margin: 5px 0;
            border-radius: 4px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #45a049; }
        .log {
            background: #000;
            color: #0f0;
            padding: 10px;
            font-family: monospace;
            height: 200px;
            overflow-y: auto;
            border-radius: 4px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="game-canvas"></canvas>
    </div>
    
    <div id="diagnosticSidebar">
        <h1 style="margin-top: 0;">🔧 Diagnostic</h1>
        
        <div class="diagnostic-panel">
            <h2>Test Controls</h2>
            <button onclick="runFullDiagnostic()">🔍 Run Full Diagnostic</button>
            <button onclick="testSerfAssignment()">👥 Test Serf Assignment</button>
            <button onclick="forceAssignSerf()">⚡ Force Assign Serf</button>
            <button onclick="clearLog()">🗑️ Clear Log</button>
            <button onclick="testTaskBasedAssignment()">🔧 Test Task-Based Assignment</button>
        </div>

        <div class="diagnostic-panel">
            <h2>📊 System Status</h2>
            <div id="systemStatus">Initializing...</div>
        </div>

        <div class="diagnostic-panel">
            <h2>🏗️ Buildings Status</h2>
            <div id="buildingsStatus">Loading...</div>
        </div>

        <div class="diagnostic-panel">
            <h2>👥 Serfs Status</h2>
            <div id="serfsStatus">Loading...</div>
        </div>

        <div class="diagnostic-panel">
            <h2>📝 Diagnostic Log</h2>
            <div id="diagnosticLog" class="log"></div>
        </div>
    </div>

    <script type="module">
        import Game from './src/core/Game.js';

        let game;
        let diagnosticLog = [];

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${message}`;
            diagnosticLog.push(logEntry);
            
            const logElement = document.getElementById('diagnosticLog');
            logElement.innerHTML = diagnosticLog.slice(-50).join('\n');
            logElement.scrollTop = logElement.scrollHeight;
            
            console.log(logEntry);
        }

        function clearLog() {
            diagnosticLog = [];
            document.getElementById('diagnosticLog').innerHTML = '';
        }

        async function initializeGame() {
            try {
                log('🎮 Initializing game for diagnostic...');
                game = new Game();
                await game.init();
                log('✅ Game initialized successfully');
                
                // Update status displays
                updateSystemStatus();
                updateBuildingsStatus();
                updateSerfsStatus();
                
            } catch (error) {
                log(`❌ Game initialization failed: ${error.message}`, 'error');
                console.error('Game init error:', error);
            }
        }

        function updateSystemStatus() {
            const statusDiv = document.getElementById('systemStatus');
            if (!game) {
                statusDiv.innerHTML = '<span class="status-error">❌ Game not initialized</span>';
                return;
            }

            const status = [];
            
            // Check core managers
            status.push(`🎮 Game: <span class="status-good">✅ Running</span>`);
            status.push(`🏗️ SerfManager: <span class="${game.serfManager ? 'status-good' : 'status-error'}">${game.serfManager ? '✅' : '❌'} ${game.serfManager ? 'Active' : 'Missing'}</span>`);
            status.push(`🏠 BuildingManager: <span class="${game.buildingManager ? 'status-good' : 'status-error'}">${game.buildingManager ? '✅' : '❌'} ${game.buildingManager ? 'Active' : 'Missing'}</span>`);
            status.push(`💰 ResourceManager: <span class="${game.resourceManager ? 'status-good' : 'status-error'}">${game.resourceManager ? '✅' : '❌'} ${game.resourceManager ? 'Active' : 'Missing'}</span>`);

            statusDiv.innerHTML = status.join('<br>');
        }

        function updateBuildingsStatus() {
            const statusDiv = document.getElementById('buildingsStatus');
            if (!game || !game.buildingManager) {
                statusDiv.innerHTML = '<span class="status-error">❌ Building manager not available</span>';
                return;
            }

            const buildings = game.buildingManager.buildings;
            log(`📊 Found ${buildings.length} buildings`);

            if (buildings.length === 0) {
                statusDiv.innerHTML = '<span class="status-warning">⚠️ No buildings found. Create some buildings first.</span>';
                return;
            }

            let html = '';
            buildings.forEach(building => {
                const hasJobSlots = building.data.jobSlots > 0;
                const currentWorkers = building.workers ? building.workers.length : 0;
                const maxWorkers = building.data.jobSlots || 0;
                const profession = building.data.jobProfession || 'None';
                
                html += `<div class="building-info">
                    <strong>${building.data.name}</strong> (ID: ${building.id})<br>
                    📍 Position: (${building.position.x.toFixed(1)}, ${building.position.z.toFixed(1)})<br>
                    🏗️ Status: ${building.status}<br>
                    👥 Workers: ${currentWorkers}/${maxWorkers}<br>
                    💼 Profession: ${profession}<br>
                    🎯 Has Job Slots: <span class="${hasJobSlots ? 'status-good' : 'status-warning'}">${hasJobSlots ? '✅' : '❌'}</span><br>
                    🔓 Open Slots: <span class="${building.hasOpenJobSlots && building.hasOpenJobSlots() ? 'status-good' : 'status-warning'}">${building.hasOpenJobSlots ? building.hasOpenJobSlots() : 'Unknown'}</span>
                </div>`;
            });

            statusDiv.innerHTML = html;
        }

        function updateSerfsStatus() {
            const statusDiv = document.getElementById('serfsStatus');
            if (!game || !game.serfManager) {
                statusDiv.innerHTML = '<span class="status-error">❌ Serf manager not available</span>';
                return;
            }

            const serfs = game.serfManager.serfs;
            log(`👥 Found ${serfs.length} serfs`);

            if (serfs.length === 0) {
                statusDiv.innerHTML = '<span class="status-warning">⚠️ No serfs found. Spawn some serfs first.</span>';
                return;
            }

            let html = '';
            serfs.forEach((serf, index) => {
                const hasJob = serf.jobBuilding !== null;
                const profession = serf.profession || 'None';
                const currentTask = serf.currentTask ? serf.currentTask.constructor.name : 'None';
                const serfId = serf.id || `serf-${index}`;  // Fallback to index if no ID
                
                html += `<div class="serf-info">
                    <strong>Serf ${serfId}</strong><br>
                    💼 Profession: ${profession}<br>
                    🏢 Job Building: ${hasJob ? `Building ${serf.jobBuilding.id}` : 'None'}<br>
                    📋 Current Task: ${currentTask}<br>
                    🎯 Has Job: <span class="${hasJob ? 'status-good' : 'status-warning'}">${hasJob ? '✅' : '❌'}</span>
                </div>`;
            });

            statusDiv.innerHTML = html;
        }

        function runFullDiagnostic() {
            log('🔍 Starting full diagnostic...');
            
            updateSystemStatus();
            updateBuildingsStatus();
            updateSerfsStatus();
            
            // Test serf assignment logic
            if (game && game.serfManager) {
                log('🧪 Testing serf assignment logic...');
                
                // Call the assignment method and log results
                try {
                    const beforeAssignment = game.serfManager.serfs.filter(s => s.jobBuilding !== null).length;
                    log(`📊 Serfs with jobs before assignment: ${beforeAssignment}`);
                    
                    game.serfManager.tryAssignSerfsToProfessionJobs();
                    
                    const afterAssignment = game.serfManager.serfs.filter(s => s.jobBuilding !== null).length;
                    log(`📊 Serfs with jobs after assignment: ${afterAssignment}`);
                    
                    if (afterAssignment > beforeAssignment) {
                        log(`✅ Success! ${afterAssignment - beforeAssignment} new serf(s) assigned to jobs`);
                    } else {
                        log(`⚠️ No new assignments made. Investigating...`);
                        
                        // Debug why no assignments were made
                        const availableSerfs = game.serfManager.serfs.filter(s => s.profession === 'Idle' && s.jobBuilding === null);
                        const buildingsWithOpenSlots = game.buildingManager.buildings.filter(b => 
                            b.status === 'Built' && b.data.jobSlots > 0 && b.hasOpenJobSlots && b.hasOpenJobSlots()
                        );
                        
                        log(`🔍 Available idle serfs: ${availableSerfs.length}`);
                        log(`🔍 Buildings with open slots: ${buildingsWithOpenSlots.length}`);
                        
                        if (availableSerfs.length === 0) {
                            log(`❌ No idle serfs available for assignment`);
                        }
                        if (buildingsWithOpenSlots.length === 0) {
                            log(`❌ No buildings with open job slots`);
                        }
                    }
                    
                } catch (error) {
                    log(`❌ Error during assignment test: ${error.message}`, 'error');
                    console.error('Assignment error:', error);
                }
            }
            
            // Refresh displays
            setTimeout(() => {
                updateBuildingsStatus();
                updateSerfsStatus();
            }, 100);
            
            log('✅ Full diagnostic completed');
        }

        function testSerfAssignment() {
            if (!game || !game.serfManager) {
                log('❌ Cannot test assignment - game not ready', 'error');
                return;
            }
            
            log('🧪 Testing serf assignment process...');
            
            // Create a test building if none exist
            if (game.buildingManager.buildings.length === 0) {
                log('🏗️ No buildings found, creating test Woodcutter Hut...');
                
                // Place a Woodcutter Hut for testing
                const position = { x: 10, z: 10 };
                game.buildingManager.placeBuilding('WoodcutterHut', position);
                
                // Find the newly created building and complete its construction
                const newBuilding = game.buildingManager.buildings[game.buildingManager.buildings.length - 1];
                if (newBuilding) {
                    newBuilding.status = 'Built';
                    newBuilding.constructionProgress = 1.0;
                    log(`✅ Created and completed Woodcutter Hut at (${position.x}, ${position.z})`);
                }
            }
            
            // Create test serfs if none exist
            if (game.serfManager.serfs.length === 0) {
                log('👥 No serfs found, spawning test serfs...');
                
                const castle = game.buildingManager.buildings.find(b => b.data.name === 'Castle');
                const spawnPosition = castle ? castle.position : { x: 0, z: 0 };
                
                for (let i = 0; i < 3; i++) {
                    game.serfManager.spawnSerf(spawnPosition);
                }
                log(`✅ Spawned 3 test serfs`);
            }
            
            // Run the assignment
            runFullDiagnostic();
        }

        function forceAssignSerf() {
            if (!game || !game.serfManager || !game.buildingManager) {
                log('❌ Cannot force assignment - game not ready', 'error');
                return;
            }
            
            log('⚡ Attempting to force assign a serf...');
            
            // Find an idle serf
            const idleSerf = game.serfManager.serfs.find(s => s.profession === 'Idle' && s.jobBuilding === null);
            if (!idleSerf) {
                log('❌ No idle serfs available for forced assignment', 'error');
                return;
            }
            
            // Find a building with open slots
            const availableBuilding = game.buildingManager.buildings.find(b => 
                b.status === 'Built' && 
                b.data.jobSlots > 0 && 
                b.hasOpenJobSlots && 
                b.hasOpenJobSlots()
            );
            
            if (!availableBuilding) {
                log('❌ No buildings with open job slots available', 'error');
                return;
            }
            
            try {
                const serfId = idleSerf.id || 'unknown';
                log(`🔧 Forcing assignment: Serf ${serfId} → ${availableBuilding.data.name} (${availableBuilding.id})`);
                
                // Manually assign the serf
                const profession = availableBuilding.data.jobProfession;
                idleSerf.setProfession(profession, availableBuilding);
                availableBuilding.addWorker(idleSerf);
                
                log(`✅ Forced assignment successful!`);
                log(`   Serf ${serfId} profession: ${idleSerf.profession}`);
                log(`   Serf ${serfId} job building: ${idleSerf.jobBuilding ? idleSerf.jobBuilding.id : 'None'}`);
                log(`   Building ${availableBuilding.id} workers: ${availableBuilding.workers.length}/${availableBuilding.data.jobSlots}`);
                
                // Update displays
                setTimeout(() => {
                    updateBuildingsStatus();
                    updateSerfsStatus();
                }, 100);
                
            } catch (error) {
                log(`❌ Error during forced assignment: ${error.message}`, 'error');
                console.error('Forced assignment error:', error);
            }
        }

        function testTaskBasedAssignment() {
            if (!game || !game.serfManager || !game.buildingManager) {
                log('❌ Cannot test task-based assignment - game not ready', 'error');
                return;
            }
            
            log('🔧 Testing Task-based assignment system...');
            
            // Ensure we have test setup
            testSerfAssignment();
            
            // Find an idle serf and a building
            const idleSerf = game.serfManager.serfs.find(s => s.profession === 'Idle' && s.jobBuilding === null);
            const availableBuilding = game.buildingManager.buildings.find(b => 
                b.status === 'Built' && 
                b.data.jobSlots > 0 && 
                b.hasOpenJobSlots && 
                b.hasOpenJobSlots()
            );
            
            if (!idleSerf || !availableBuilding) {
                log('❌ Cannot test - need idle serf and available building', 'error');
                return;
            }
            
            try {
                const serfId = idleSerf.id || 'unknown';
                log(`🧪 Testing assignment: Serf ${serfId} → ${availableBuilding.data.name}`);
                
                // Store before state
                const beforeProfession = idleSerf.profession;
                const beforeJobBuilding = idleSerf.jobBuilding;
                const beforeTask = idleSerf.currentTask;
                const beforeTaskCount = game.serfManager.tasks.length;
                
                log(`📊 BEFORE - Profession: ${beforeProfession}, Job: ${beforeJobBuilding ? beforeJobBuilding.id : 'None'}, Task: ${beforeTask ? beforeTask.constructor.name : 'None'}`);
                log(`📊 BEFORE - Active tasks in system: ${beforeTaskCount}`);
                
                // Run the assignment
                game.serfManager.tryAssignSerfsToProfessionJobs();
                
                // Check after state
                const afterProfession = idleSerf.profession;
                const afterJobBuilding = idleSerf.jobBuilding;
                const afterTask = idleSerf.currentTask;
                const afterTaskCount = game.serfManager.tasks.length;
                
                log(`📊 AFTER - Profession: ${afterProfession}, Job: ${afterJobBuilding ? afterJobBuilding.id : 'None'}, Task: ${afterTask ? afterTask.constructor.name : 'None'}`);
                log(`📊 AFTER - Active tasks in system: ${afterTaskCount}`);
                
                // Analyze results
                const professionChanged = beforeProfession !== afterProfession;
                const jobAssigned = beforeJobBuilding !== afterJobBuilding;
                const taskAssigned = beforeTask !== afterTask;
                const taskCountIncreased = afterTaskCount > beforeTaskCount;
                
                log(`🔍 ANALYSIS:`);
                log(`   Profession changed: ${professionChanged ? '✅' : '❌'} (${beforeProfession} → ${afterProfession})`);
                log(`   Job assigned: ${jobAssigned ? '✅' : '❌'}`);
                log(`   Task assigned: ${taskAssigned ? '✅' : '❌'} (${afterTask ? afterTask.constructor.name : 'None'})`);
                log(`   Task count increased: ${taskCountIncreased ? '✅' : '❌'} (${beforeTaskCount} → ${afterTaskCount})`);
                
                if (professionChanged && jobAssigned && taskAssigned && taskCountIncreased) {
                    log('🎉 SUCCESS! Task-based assignment system working correctly!');
                } else {
                    log('⚠️ PARTIAL SUCCESS or ISSUES detected in task-based assignment');
                }
                
                // Update displays
                setTimeout(() => {
                    updateBuildingsStatus();
                    updateSerfsStatus();
                }, 100);
                
            } catch (error) {
                log(`❌ Error during task-based assignment test: ${error.message}`, 'error');
                console.error('Task-based assignment error:', error);
            }
        }

        // Global functions for buttons
        window.runFullDiagnostic = runFullDiagnostic;
        window.testSerfAssignment = testSerfAssignment;
        window.forceAssignSerf = forceAssignSerf;
        window.testTaskBasedAssignment = testTaskBasedAssignment;
        window.clearLog = clearLog;

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initializeGame);
    </script>
</body>
</html>
