<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction Cycle Test</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
        }
        #test-container {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 5px;
            max-width: 400px;
        }
        .test-button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 3px;
            cursor: pointer;
        }
        .test-button:hover {
            background: #45a049;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 3px;
            border-left: 4px solid #4CAF50;
            background: rgba(76, 175, 80, 0.1);
        }
        .test-result.error {
            border-left-color: #f44336;
            background: rgba(244, 67, 54, 0.1);
        }
        #status {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="test-container">
        <h3>Construction Cycle Test</h3>
        <button class="test-button" onclick="testConstructionCycle()">Test Full Construction Cycle</button>
        <button class="test-button" onclick="testPriorityQueue()">Test Priority Queue</button>
        <button class="test-button" onclick="testErrorRecovery()">Test Error Recovery</button>
        <button class="test-button" onclick="clearResults()">Clear Results</button>
        <div id="status">Ready to test...</div>
        <div id="results"></div>
    </div>

    <!-- Include the main game iframe for testing -->
    <iframe src="http://localhost:5173/" style="width: 100%; height: 100vh; border: none;"></iframe>

    <script>
        let testResults = [];
        
        function addResult(message, isError = false) {
            testResults.push({ message, isError, timestamp: new Date().toLocaleTimeString() });
            updateResults();
        }
        
        function updateResults() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = testResults.map(result => 
                `<div class="test-result ${result.isError ? 'error' : ''}">
                    [${result.timestamp}] ${result.message}
                </div>`
            ).join('');
        }
        
        function clearResults() {
            testResults = [];
            updateResults();
            document.getElementById('status').textContent = 'Results cleared';
        }
        
        function setStatus(message) {
            document.getElementById('status').textContent = message;
        }
        
        async function testConstructionCycle() {
            setStatus('Testing construction cycle...');
            addResult('Starting construction cycle test');
            
            try {
                // Test accessing the game instance from the iframe
                const iframe = document.querySelector('iframe');
                await new Promise(resolve => {
                    if (iframe.contentWindow.game) {
                        resolve();
                    } else {
                        iframe.onload = () => {
                            setTimeout(resolve, 2000); // Wait for game initialization
                        };
                    }
                });
                
                const game = iframe.contentWindow.game;
                if (!game) {
                    addResult('Game instance not found in iframe', true);
                    return;
                }
                
                // Test 1: Check initial setup
                addResult(`Initial buildings count: ${game.constructionManager.placedBuildings.length}`);
                addResult(`Available builders: ${game.serfManager.getAvailableSerfsByProfession('BUILDER').length}`);
                
                // Test 2: Add resources for construction
                game.resourceManager.addResource('WOOD', 50);
                addResult('Added 50 wood for testing');
                
                // Test 3: Start building placement
                game.constructionManager.startPlacement('WOODCUTTERS_HUT');
                addResult('Started Woodcutter\'s Hut placement');
                
                // Test 4: Simulate placement at a valid location
                const centerX = game.gameMap.width / 2;
                const centerZ = game.gameMap.height / 2;
                const worldPos = { x: centerX * 10, z: centerZ * 10 }; // Adjust for TILE_SIZE
                
                const success = game.constructionManager.confirmPlacement(worldPos);
                if (success) {
                    addResult('Building placement confirmed successfully');
                } else {
                    addResult('Building placement failed', true);
                    return;
                }
                
                // Test 5: Monitor construction progress
                addResult(`Construction queue size: ${game.constructionManager.constructionQueue.length}`);
                addResult(`Active constructions: ${game.constructionManager.activeConstructions.length}`);
                
                // Test 6: Wait and monitor progress
                setTimeout(() => {
                    const activeConstructions = game.constructionManager.activeConstructions;
                    if (activeConstructions.length > 0) {
                        const building = activeConstructions[0];
                        const progress = (building.currentConstructionProgress / building.constructionRequiredTime * 100).toFixed(1);
                        addResult(`Construction progress: ${progress}%`);
                        
                        if (building.assignedBuilderId) {
                            addResult(`Builder ${building.assignedBuilderId} assigned to construction`);
                        }
                    }
                    
                    // Continue monitoring
                    const progressInterval = setInterval(() => {
                        const completedBuildings = game.constructionManager.placedBuildings.filter(b => b.type === 'WOODCUTTERS_HUT');
                        if (completedBuildings.length > 0) {
                            addResult('Construction completed successfully! ✓');
                            addResult(`Total completed buildings: ${game.constructionManager.placedBuildings.length}`);
                            clearInterval(progressInterval);
                            setStatus('Construction cycle test completed');
                        }
                    }, 1000);
                    
                    // Stop monitoring after 30 seconds
                    setTimeout(() => {
                        clearInterval(progressInterval);
                        if (game.constructionManager.activeConstructions.length > 0) {
                            addResult('Construction still in progress after 30s', true);
                        }
                    }, 30000);
                }, 3000);
                
            } catch (error) {
                addResult(`Test error: ${error.message}`, true);
                setStatus('Test failed');
            }
        }
        
        async function testPriorityQueue() {
            setStatus('Testing priority queue...');
            addResult('Starting priority queue test');
            
            try {
                const iframe = document.querySelector('iframe');
                const game = iframe.contentWindow.game;
                
                if (!game) {
                    addResult('Game instance not found', true);
                    return;
                }
                
                // Add enough resources
                game.resourceManager.addResource('WOOD', 200);
                game.resourceManager.addResource('STONE', 100);
                
                // Queue multiple buildings with different priorities
                const buildings = ['WOODCUTTERS_HUT', 'QUARRY', 'BUILDERS_HUT'];
                const positions = [
                    { x: 50, z: 50 },
                    { x: 70, z: 50 },
                    { x: 90, z: 50 }
                ];
                
                for (let i = 0; i < buildings.length; i++) {
                    game.constructionManager.startPlacement(buildings[i]);
                    game.constructionManager.confirmPlacement(positions[i]);
                    addResult(`Queued ${buildings[i]} for construction`);
                }
                
                addResult(`Queue size after adding buildings: ${game.constructionManager.constructionQueue.length}`);
                
                // Check if queue is sorted by priority
                const queue = game.constructionManager.constructionQueue;
                if (queue.length > 1) {
                    const priorities = queue.map(b => b.info.tier || 0);
                    const isSorted = priorities.every((val, i, arr) => i === 0 || arr[i - 1] <= val);
                    addResult(`Queue is ${isSorted ? 'properly' : 'not'} sorted by priority`);
                }
                
                setStatus('Priority queue test completed');
                
            } catch (error) {
                addResult(`Priority queue test error: ${error.message}`, true);
                setStatus('Priority queue test failed');
            }
        }
        
        async function testErrorRecovery() {
            setStatus('Testing error recovery...');
            addResult('Starting error recovery test');
            
            try {
                const iframe = document.querySelector('iframe');
                const game = iframe.contentWindow.game;
                
                if (!game) {
                    addResult('Game instance not found', true);
                    return;
                }
                
                // Test builder interruption scenario
                const builders = game.serfManager.serfs.filter(s => s.profession === 'BUILDER');
                if (builders.length > 0) {
                    const builder = builders[0];
                    const builderId = builder.id;
                    
                    // Add resources and start construction
                    game.resourceManager.addResource('WOOD', 50);
                    game.constructionManager.startPlacement('WOODCUTTERS_HUT');
                    game.constructionManager.confirmPlacement({ x: 110, z: 50 });
                    
                    // Wait for assignment
                    setTimeout(() => {
                        const activeConstruction = game.constructionManager.activeConstructions[0];
                        if (activeConstruction && activeConstruction.assignedBuilderId === builderId) {
                            addResult(`Builder ${builderId} assigned to construction`);
                            
                            // Simulate builder interruption by removing them
                            game.serfManager.removeSerf(builderId);
                            addResult(`Simulated builder ${builderId} interruption (removed)`);
                            
                            // Check if construction manager handles the error
                            setTimeout(() => {
                                const isBackInQueue = game.constructionManager.constructionQueue.some(b => b.id === activeConstruction.id);
                                if (isBackInQueue) {
                                    addResult('Error recovery successful: Building returned to queue ✓');
                                } else {
                                    addResult('Error recovery failed: Building not returned to queue', true);
                                }
                                setStatus('Error recovery test completed');
                            }, 2000);
                        }
                    }, 3000);
                }
                
            } catch (error) {
                addResult(`Error recovery test error: ${error.message}`, true);
                setStatus('Error recovery test failed');
            }
        }
    </script>
</body>
</html>
