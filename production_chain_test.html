<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProductionChainUI Integration Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
        }
        .test-overlay {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.9);
            padding: 20px;
            border-radius: 8px;
            z-index: 1000;
            max-width: 300px;
        }
        .status {
            margin: 5px 0;
            padding: 5px 10px;
            border-radius: 4px;
        }
        .success { background: rgba(76,175,80,0.3); }
        .error { background: rgba(244,67,54,0.3); }
        .warning { background: rgba(255,193,7,0.3); }
        .info { background: rgba(33,150,243,0.3); }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px 0;
            width: 100%;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="ui-container" style="position: relative; width: 100vw; height: 100vh;">
            <canvas id="game-canvas" style="display: block; width: 100%; height: 100%;"></canvas>
        </div>
    </div>

    <div class="test-overlay">
        <h3>ProductionChainUI Test</h3>
        <div id="test-results"></div>
        <button onclick="runTests()">Run Tests</button>
        <button onclick="testProductionChainUI()">Test ProductionChainUI</button>
    </div>

    <script type="module">
        let game = null;
        
        async function loadGame() {
            try {
                const gameModule = await import('./src/main.js');
                game = window.game;
                console.log('Game loaded:', game);
                return true;
            } catch (error) {
                console.error('Failed to load game:', error);
                return false;
            }
        }

        function addTestResult(message, type = 'info') {
            const resultsDiv = document.getElementById('test-results');
            const statusDiv = document.createElement('div');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
            resultsDiv.appendChild(statusDiv);
        }

        function clearResults() {
            document.getElementById('test-results').innerHTML = '';
        }

        window.runTests = async function() {
            clearResults();
            addTestResult('Starting integration tests...', 'info');
            
            // Test 1: Canvas exists
            const canvas = document.getElementById('game-canvas');
            if (canvas) {
                addTestResult('✓ Canvas found', 'success');
            } else {
                addTestResult('✗ Canvas not found', 'error');
                return;
            }

            // Test 2: UI Container exists
            const uiContainer = document.getElementById('ui-container');
            if (uiContainer) {
                addTestResult('✓ UI Container found', 'success');
            } else {
                addTestResult('✗ UI Container not found', 'error');
                return;
            }

            // Test 3: Load game
            const gameLoaded = await loadGame();
            if (gameLoaded && game) {
                addTestResult('✓ Game loaded successfully', 'success');
            } else {
                addTestResult('✗ Game failed to load', 'error');
                return;
            }

            // Test 4: UIManager exists
            if (game.uiManager) {
                addTestResult('✓ UIManager initialized', 'success');
            } else {
                addTestResult('✗ UIManager not found', 'error');
                return;
            }

            // Test 5: ProductionChainUI exists
            if (game.uiManager.productionChainUI) {
                addTestResult('✓ ProductionChainUI initialized', 'success');
            } else {
                addTestResult('✗ ProductionChainUI not found', 'error');
            }

            // Test 6: UI Overlay exists
            const uiOverlay = document.getElementById('ui-overlay');
            if (uiOverlay) {
                addTestResult('✓ UI Overlay created', 'success');
            } else {
                addTestResult('⚠ UI Overlay not found', 'warning');
            }

            // Test 7: Canvas still exists after UI init
            const canvasAfter = document.getElementById('game-canvas');
            if (canvasAfter && canvasAfter.parentNode) {
                addTestResult('✓ Canvas preserved after UI init', 'success');
            } else {
                addTestResult('✗ Canvas lost after UI init', 'error');
            }
        };

        window.testProductionChainUI = function() {
            if (!game || !game.uiManager || !game.uiManager.productionChainUI) {
                addTestResult('✗ ProductionChainUI not available', 'error');
                return;
            }

            try {
                // Try to call the update method that was failing
                game.uiManager.productionChainUI.update();
                addTestResult('✓ ProductionChainUI.update() successful', 'success');
            } catch (error) {
                addTestResult(`✗ ProductionChainUI.update() failed: ${error.message}`, 'error');
            }
        };

        // Auto-run tests after a delay
        setTimeout(() => {
            runTests();
        }, 2000);
    </script>
</body>
</html>
