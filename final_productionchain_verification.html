<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProductionChainUI Fix Verification</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: white;
        }
        .status-panel {
            background: rgba(0,0,0,0.8);
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            border-left: 4px solid #4CAF50;
        }
        .status {
            padding: 8px 12px;
            border-radius: 4px;
            margin: 5px 0;
            font-family: 'Courier New', monospace;
        }
        .success { background: rgba(76,175,80,0.3); }
        .error { background: rgba(244,67,54,0.3); }
        .warning { background: rgba(255,193,7,0.3); }
        .info { background: rgba(33,150,243,0.3); }
        .code-block {
            background: #000;
            color: #0f0;
            padding: 15px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            margin: 10px 0;
            overflow-x: auto;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="ui-container" style="position: relative; width: 100vw; height: 100vh;">
            <canvas id="game-canvas" style="display: block; width: 100%; height: 100%;"></canvas>
        </div>
    </div>

    <div class="status-panel">
        <h1>🔧 ProductionChainUI Integration Fix Verification</h1>
        <p>Testing the specific issue: <code>this.uiManager.productionChainUI.update()</code> failing because productionChainUI was undefined.</p>
        
        <div id="test-results"></div>
        
        <div>
            <button onclick="runVerification()">Run Verification</button>
            <button onclick="testUpdateMethod()">Test Update Method</button>
            <button onclick="showDebugInfo()">Show Debug Info</button>
        </div>

        <div id="debug-output" class="code-block" style="display: none;">
            Debug information will appear here...
        </div>
    </div>

    <script type="module">
        let game = null;
        let verificationResults = {};

        function addResult(message, type = 'info') {
            const resultsDiv = document.getElementById('test-results');
            const statusDiv = document.createElement('div');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
            resultsDiv.appendChild(statusDiv);
        }

        function clearResults() {
            document.getElementById('test-results').innerHTML = '';
        }

        async function loadGameModule() {
            try {
                console.log('Loading game module...');
                const gameModule = await import('./src/main.js');
                
                // Wait for game instance to be available
                let attempts = 0;
                while (!window.game && attempts < 30) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    attempts++;
                }
                
                game = window.game;
                return game !== null;
            } catch (error) {
                console.error('Failed to load game module:', error);
                return false;
            }
        }

        window.runVerification = async function() {
            clearResults();
            addResult('🚀 Starting ProductionChainUI verification...', 'info');
            
            // Step 1: Check canvas preservation
            const canvas = document.getElementById('game-canvas');
            if (canvas) {
                addResult('✅ Step 1: Canvas element preserved', 'success');
                verificationResults.canvas = true;
            } else {
                addResult('❌ Step 1: Canvas element missing', 'error');
                verificationResults.canvas = false;
                return;
            }

            // Step 2: Check UI container
            const uiContainer = document.getElementById('ui-container');
            if (uiContainer) {
                addResult('✅ Step 2: UI container found', 'success');
                verificationResults.uiContainer = true;
            } else {
                addResult('❌ Step 2: UI container missing', 'error');
                verificationResults.uiContainer = false;
                return;
            }

            // Step 3: Load game
            const gameLoaded = await loadGameModule();
            if (gameLoaded) {
                addResult('✅ Step 3: Game module loaded successfully', 'success');
                verificationResults.gameLoaded = true;
            } else {
                addResult('❌ Step 3: Game module failed to load', 'error');
                verificationResults.gameLoaded = false;
                return;
            }

            // Step 4: Check UIManager
            if (game.uiManager) {
                addResult('✅ Step 4: UIManager initialized', 'success');
                verificationResults.uiManager = true;
            } else {
                addResult('❌ Step 4: UIManager not found', 'error');
                verificationResults.uiManager = false;
                return;
            }

            // Step 5: Check ProductionChainManager
            if (game.productionChainManager) {
                addResult('✅ Step 5: ProductionChainManager initialized', 'success');
                verificationResults.productionChainManager = true;
            } else {
                addResult('❌ Step 5: ProductionChainManager not found', 'error');
                verificationResults.productionChainManager = false;
                return;
            }

            // Step 6: Check ProductionChainUI (the core issue)
            if (game.uiManager.productionChainUI) {
                addResult('✅ Step 6: ProductionChainUI initialized - ISSUE RESOLVED!', 'success');
                verificationResults.productionChainUI = true;
            } else {
                addResult('❌ Step 6: ProductionChainUI still undefined - ISSUE PERSISTS', 'error');
                verificationResults.productionChainUI = false;
                return;
            }

            // Step 7: Canvas still exists after UI initialization
            const canvasAfterUI = document.getElementById('game-canvas');
            if (canvasAfterUI && canvasAfterUI.parentNode) {
                addResult('✅ Step 7: Canvas preserved after UI initialization', 'success');
                verificationResults.canvasPreserved = true;
            } else {
                addResult('❌ Step 7: Canvas lost during UI initialization', 'error');
                verificationResults.canvasPreserved = false;
            }

            // Final result
            const allPassed = Object.values(verificationResults).every(result => result === true);
            if (allPassed) {
                addResult('🎉 SUCCESS: ProductionChainUI integration issue is RESOLVED!', 'success');
            } else {
                addResult('⚠️ PARTIAL: Some issues remain', 'warning');
            }
        };

        window.testUpdateMethod = function() {
            if (!game || !game.uiManager || !game.uiManager.productionChainUI) {
                addResult('❌ Cannot test update method: ProductionChainUI not available', 'error');
                return;
            }

            try {
                // This was the original failing call
                game.uiManager.productionChainUI.update();
                addResult('✅ SUCCESS: productionChainUI.update() executed without errors!', 'success');
                addResult('🎯 ORIGINAL ISSUE FIXED: The failing call now works', 'success');
            } catch (error) {
                addResult(`❌ FAILED: productionChainUI.update() error: ${error.message}`, 'error');
                addResult('⚠️ Original issue still exists', 'warning');
            }
        };

        window.showDebugInfo = function() {
            const debugDiv = document.getElementById('debug-output');
            debugDiv.style.display = debugDiv.style.display === 'none' ? 'block' : 'none';
            
            if (debugDiv.style.display === 'block') {
                let debugInfo = 'DEBUGGING INFORMATION\\n';
                debugInfo += '='.repeat(50) + '\\n';
                debugInfo += `Game instance: ${!!game}\\n`;
                debugInfo += `UIManager: ${!!(game && game.uiManager)}\\n`;
                debugInfo += `ProductionChainManager: ${!!(game && game.productionChainManager)}\\n`;
                debugInfo += `ProductionChainUI: ${!!(game && game.uiManager && game.uiManager.productionChainUI)}\\n`;
                debugInfo += `Canvas element: ${!!document.getElementById('game-canvas')}\\n`;
                debugInfo += `UI Container: ${!!document.getElementById('ui-container')}\\n`;
                debugInfo += `UI Overlay: ${!!document.getElementById('ui-overlay')}\\n`;
                
                if (game && game.uiManager) {
                    debugInfo += `\\nUIManager container: ${game.uiManager.uiContainer.id || 'no id'}\\n`;
                    debugInfo += `UIManager overlay: ${!!(game.uiManager.uiOverlay)}\\n`;
                }
                
                debugInfo += `\\nVerification Results:\\n`;
                debugInfo += JSON.stringify(verificationResults, null, 2);
                
                debugDiv.textContent = debugInfo;
            }
        };

        // Auto-run verification after a delay
        setTimeout(() => {
            addResult('🔄 Auto-running verification in 2 seconds...', 'info');
            setTimeout(runVerification, 2000);
        }, 1000);
    </script>
</body>
</html>
